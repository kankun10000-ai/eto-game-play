<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ガンバレ！江藤くん 最強ナース烈伝</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#0d1b2a;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;color:#1b2a3a}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#fff}
/* ===== 上段 6 ===== */
#top{flex:5;min-height:0;position:relative;overflow:hidden;background:#7ccf6b}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;padding:6px 10px;font-size:12px;font-weight:800;color:#fff;background:rgba(13,27,42,.6);display:flex;justify-content:space-between;z-index:3}
#note{position:absolute;inset:34px 6px 6px 6px;z-index:7;display:none;overflow:auto;background:#fffbe6;border:5px solid #a8682f;border-radius:10px;padding:12px 14px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#note h2{font-size:18px;color:#d7263d;border-bottom:3px double #a8682f;padding-bottom:4px}
#note .by{font-size:12px;font-weight:700;color:#7a4a21;margin-top:4px}
#note ul{margin:8px 0 0 1.1em;font-size:14.5px;line-height:1.6;font-weight:600}
#note li{margin-bottom:6px}
#note li small{display:block;font-size:12px;font-weight:500;color:#55708a}
#note .ans{color:#d7263d}
#note .dexg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.dx{background:#fff;border:2px solid #0d1b2a;border-radius:8px;padding:3px;text-align:center;line-height:1.25}
.dx img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:5px;display:block}
.dx.un img{filter:brightness(0)}
.dx.seen img{filter:grayscale(1) brightness(.75)}
.dx b{display:block;font-size:10px}
.dx i{display:block;font-style:normal;color:#55708a;font-size:9px}
.dx span{color:#d7263d;font-weight:900;font-size:11px}
#note .pg{font-size:11px;font-weight:800;color:#7a4a21;text-align:right}
#note .say{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid #e08a00;border-radius:10px;padding:6px;margin:4px 0 8px;font-size:13px;font-weight:700}
#note .say img{width:60px;height:45px;object-fit:cover;border-radius:6px;border:2px solid #0d1b2a;flex:none}
button:disabled{opacity:.45}
#snd{position:absolute;top:3px;right:4px;z-index:9;width:36px;height:26px;font-size:14px;padding:0;border-radius:8px;box-shadow:none;background:rgba(255,255,255,.9)}
#hud{padding-right:46px !important}
#msg{flex:none;background:#fff;border:3px solid #ffe14d;border-radius:10px;padding:8px 10px;font-size:17px;font-weight:700;line-height:1.5;max-height:42%;overflow:auto;display:none}
#msg .who{display:inline-block;font-size:13px;color:#fff;background:#0d1b2a;border-radius:8px;padding:1px 8px;margin-bottom:3px}
#msg .who.eto{background:#e08a00}
#msg .who.foe{background:#d7263d}
#msg .pf{float:left;width:64px;height:48px;object-fit:cover;border:3px solid #0d1b2a;border-radius:8px;margin:0 8px 2px 0}
#msg small{clear:both;display:block;margin-top:6px;padding-top:5px;border-top:1px dashed #9ab;font-size:14.5px;font-weight:500;color:#33506b}
/* タイトル */
#title{position:absolute;inset:0;z-index:8;background:linear-gradient(#ffb347,#ffe14d 55%,#7ccf6b);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
#title h1{font-size:32px;line-height:1.15;color:#fff;text-shadow:3px 3px 0 #e0457b,-2px -2px 0 #0d1b2a,2px -2px 0 #0d1b2a,-2px 2px 0 #0d1b2a}
#title h1 em{font-style:normal;color:#ffe14d;font-size:42px}
#title .sub{margin-top:6px;font-size:20px;font-weight:900;color:#d7263d;letter-spacing:.12em;text-shadow:2px 2px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff}
#title .credit{position:absolute;bottom:4px;left:0;right:0;font-size:10px;font-weight:700;color:#0d1b2a;opacity:.7}
#title .ver{margin-top:4px;font-size:14px;font-weight:900;color:#0d1b2a;background:#fff;border:3px solid #0d1b2a;border-radius:10px;padding:0 10px;letter-spacing:.05em}
#title p{margin-top:6px;font-size:13px;font-weight:800;background:#0d1b2a;color:#ffe14d;border-radius:12px;padding:3px 14px}
#title img{height:42%;max-width:90%;object-fit:contain;margin-top:10px;filter:drop-shadow(0 4px 0 rgba(13,27,42,.3))}
/* バトル */
#battle{position:absolute;inset:0;z-index:5;display:none;background:linear-gradient(#bfe9ff 0 52%,#9bd67f 52% 100%)}
#battle.flash{animation:flash .5s 2}
@keyframes flash{50%{filter:invert(1)}}
.plat{position:absolute;border-radius:50%;background:rgba(40,90,40,.3)}
#platE{display:none}
#platP{display:none}
#foe{position:absolute;right:5%;top:9%;height:54%;aspect-ratio:2/3}
#foe img{height:100%;width:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 4px 0 rgba(13,27,42,.3))}
#me{position:absolute;left:4%;top:42%;height:33%;aspect-ratio:4/3}
#me img{height:100%;width:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 4px 0 rgba(13,27,42,.3))}
.stat{position:absolute;background:#fffbe6;border:3px solid #0d1b2a;border-radius:10px 2px 10px 2px;padding:5px 9px;width:48%;font-size:13px;font-weight:900;z-index:2}
#statE{left:3%;top:9%}
#statP{right:3%;bottom:5%}
.stat .lv{float:right;font-size:11px;font-weight:700}
.bar{margin-top:4px;height:9px;background:#3a4a5a;border-radius:5px;overflow:hidden;border:2px solid #0d1b2a}
.bar i{display:block;height:100%;background:#35d07f;transition:width .5s,background .5s}
.bar i.mid{background:#f5c518}.bar i.low{background:#ef4444}
.hpn{font-size:11px;text-align:right;font-weight:700;margin-top:1px}
.hit{animation:hit .45s}
@keyframes hit{0%,100%{transform:none;opacity:1}20%{transform:translateX(10px);opacity:.2}40%{opacity:1}60%{transform:translateX(-10px);opacity:.2}}
.atk{animation:atk .35s}
@keyframes atk{50%{transform:translate(26px,-16px)}}
.atk2{animation:atk2 .35s}
@keyframes atk2{50%{transform:translate(-26px,16px)}}
.faint{animation:faint .6s forwards}
@keyframes faint{to{transform:translateY(60%);opacity:0}}
/* ===== 下段 4 ===== */
#bottom{flex:5;min-height:0;background:#0d1b2a;padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;border-top:4px solid #ffe14d}
#lbl{color:#ffe14d;font-size:12px;font-weight:800;display:flex;justify-content:space-between}
#pane{flex:1;min-height:0;display:grid;gap:7px;overflow-y:auto}
#pane.c4{grid-template-columns:1fr 1fr}
#pane.c1{grid-template-columns:1fr}
#pane.scroll{overflow-y:auto;grid-auto-rows:46px;align-content:start;padding-bottom:6px}
#pane.scroll button{font-size:13px}
#note .card{background:#fff;border:3px solid #0d1b2a;border-radius:12px;padding:12px;margin-top:8px;font-size:16px;font-weight:700;line-height:1.5}
#note .card.back{border-color:#d7263d}
#note .card small{display:block;margin-top:6px;font-size:12.5px;font-weight:500;color:#33506b}
button{font-family:inherit;border:none;border-radius:12px;font-weight:800;font-size:15px;color:#0d1b2a;background:#fff;box-shadow:0 4px 0 #6b7f95;padding:6px;line-height:1.3;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #6b7f95}
button.main{background:#ffe14d;box-shadow:0 4px 0 #b99a00;font-size:18px}
button.right{background:#4ade80;box-shadow:0 4px 0 #1f8a48}
button.wrong{background:#f87171;box-shadow:0 4px 0 #a53030}
#side{display:flex;flex-direction:column;gap:8px;flex:none}
.sideBtn{width:78px;height:60px;font-size:13px;line-height:1.2;background:#ffe14d;box-shadow:0 4px 0 #b99a00}
button{white-space:pre-line}
#battle.room{background:linear-gradient(#2f5d50 0 26%,#7a4a21 26% 29%,#e8dcc0 29% 100%)}
.gauge{position:relative;height:124px;align-self:center}
.gauge .arm{position:absolute;left:0;right:0;top:76px;height:42px;border-radius:20px 26px 26px 20px;background:linear-gradient(#f6d2ad,#e3a978 70%,#c98a5a);border:3px solid #7a4a21;overflow:hidden}
.gauge .arm::before{content:'';position:absolute;left:0;right:0;top:17px;height:5px;background:rgba(70,110,200,.45)}
.gauge .okz{position:absolute;top:0;bottom:0;background:rgba(74,222,128,.55)}
.gauge.dodge .okz{background:rgba(96,165,250,.6)}
.gauge .vein{position:absolute;top:0;bottom:0;background:rgba(37,99,235,.75);box-shadow:0 0 0 2px #fff inset}
.gauge .syr{position:absolute;top:0;width:42px;height:84px;margin-left:-21px;transition:transform .15s;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.gauge .syr.poke{transform:translateY(10px)}
.dmg.weak{color:#cbd5e1;font-size:22px}
button.gbtn{font-size:20px}
button.main.ep{font-size:15px;line-height:1.25;padding:4px}
.dmg{position:absolute;right:8%;top:20%;z-index:4;font-size:26px;font-weight:900;color:#fff;-webkit-text-stroke:1.5px #0d1b2a;text-shadow:0 3px 0 #0d1b2a;animation:dmg 1s forwards;pointer-events:none}
.dmg.crit{color:#ffe14d;font-size:30px}
.dmg.miss{left:6%;right:auto;top:32%;color:#60a5fa}
@keyframes dmg{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.15);opacity:1}100%{transform:translateY(-40px);opacity:0}}
#battle.field{background:linear-gradient(#bfe9ff 0 44%,#d9774a 44% 50%,#7ccf6b 50% 100%)}
#note .mkc{display:flex;gap:10px;background:#fff;border:2px solid #0d1b2a;border-radius:10px;padding:8px;margin-top:8px;font-size:13px;font-weight:600;line-height:1.5}
#note .mkc img{width:64px;height:96px;object-fit:cover;border-radius:6px;border:2px solid #0d1b2a;flex:none}
#note .mkc.un img{filter:brightness(0)}
#note .mkc b{font-size:16px}#note .mkc i{font-style:normal;color:#55708a;font-size:12px}#note .mkc .st{color:#e08a00}
#note .mkc p{margin-top:4px}
#battle.shop{background:linear-gradient(#f6d7a7 0 30%,#a8682f 30% 34%,#e9eef2 34% 100%)}
.bar i.love{background:#ff5c8a}
#mapui{display:flex;height:100%;min-height:0;align-items:center;justify-content:center;gap:16px}
#bagBtn{width:78px;height:78px;font-size:14px;line-height:1.25;background:#ffe14d;box-shadow:0 4px 0 #b99a00;flex:none}
#pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;height:100%;max-height:250px;aspect-ratio:1;max-width:calc(100% - 110px);margin:0;flex:none}
#pad button{font-size:24px;background:#e8eef5;touch-action:none}
#pad .u{grid-area:1/2}#pad .l{grid-area:2/1}#pad .r{grid-area:2/3}#pad .d{grid-area:3/2}
#pad .c{grid-area:2/2;background:#ffe14d;box-shadow:0 3px 0 #b99a00;border-radius:50%;margin:2%;padding:0;font-size:11px;line-height:1.15;touch-action:manipulation}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <canvas id="cv"></canvas>
    <div id="hud"><span id="hudL">🏫 通学路</span><span id="hudR"></span></div>
    <div id="battle">
      <div class="plat" id="platE"></div><div class="plat" id="platP"></div>
      <div class="stat" id="statE"><span id="eName"></span><span class="lv" id="eLv"></span><div class="bar"><i id="eBar"></i></div></div>
      <div id="foe"></div>
      <div id="me"></div>
      <div class="stat" id="statP">江藤くん<span class="lv">Lv.18</span><div class="bar"><i id="pBar"></i></div><div class="hpn" id="pNum"></div></div>
    </div>
    <div id="note"></div>
    <button id="snd" onclick="sndToggle()">🔊</button>
    <div id="title"></div>
  </div>
  <div id="bottom">
    <div id="lbl"><span id="lblL"></span><span id="lblR"></span></div>
    <div id="msg"></div>
    <div id="pane" class="c1"></div>
  </div>
</div>
<script>
/* バージョン:更新のたびに上げる(決まりは CLAUDE.md の「バージョン」)。タブの題名にも自動で入る */
const VERSION='1.4.6';
/* ================================================================
   キャラデータ(デザインが届いたら img に画像を入れると差し替わります)
   ================================================================ */
const FOES = [
 {n:'01',name:'マッスル先輩',kind:'朝トレ中の大学生',theme:'細胞の構造',
  pre:[['foe','おい そこの金髪!バイクに乗るまえに、自分の細胞に感謝したか?'],['eto','してないっす。てか朝から上半身ハダカはキツいっす。','19'],['foe','なにぃ!? 筋肉は細胞のかたまりだぞ!細胞クイズで勝負だ!']],
  win:[['foe','ぐっ…いい細胞してるじゃねえか…。'],['eto','プロテインくさいんで、もう行っていいっすか。','15']],
  qs:[
   {q:'遺伝情報をもつDNAがおもに含まれている、細胞内の構造は?',a:'核',w:['液胞','細胞膜','細胞質基質'],ex:'真核細胞ではDNAは核の中にあり、染色体をつくっています。'},
   {q:'植物細胞にあって、動物細胞にはない構造は?',a:'細胞壁',w:['細胞膜','核','ミトコンドリア'],ex:'細胞壁・葉緑体・発達した液胞は植物細胞の特徴。細胞膜・核・ミトコンドリアはどちらにもあります。'},
   {q:'核をもたない細胞(原核細胞)でできている生物は?',a:'大腸菌',w:['酵母','ゾウリムシ','ヒト'],ex:'大腸菌や乳酸菌などの細菌は原核生物。酵母・ゾウリムシ・ヒトは核をもつ真核生物です。'},
   {q:'細胞内で、呼吸の場となる細胞小器官は?',a:'ミトコンドリア',w:['葉緑体','ゴルジ体','リボソーム'],ex:'ミトコンドリアは呼吸の場。酸素を使って有機物を分解し、ATPを合成します。'}]},
 {n:'02',name:'ミトコン店長',kind:'徹夜明けのコンビニ店長',theme:'呼吸とATP',
  pre:[['foe','いらっしゃいませぇ!!徹夜3日目、ATP切れです!!'],['eto','寝たほうがいいっすよ。顔色、レジ袋より白いっす。','19'],['foe','寝たら負けだ…!エネルギーの話で目を覚まさせてくれ!']],
  win:[['foe','ありがとう…エナジー、入荷しました…(バタッ)'],['eto','それ寝落ちっすね。','01']],
  qs:[
   {q:'生体内でエネルギーの受けわたしをし、「エネルギーの通貨」とよばれる物質は?',a:'ATP',w:['DNA','RNA','グリコーゲン'],ex:'ATP(アデノシン三リン酸)。リン酸どうしの結合が切れるときにエネルギーが放出されます。'},
   {q:'ATPからリン酸が1つはずれてできる物質は?',a:'ADP',w:['DNA','RNA','グルコース'],ex:'ATP → ADP + リン酸 + エネルギー。ADPは呼吸などで再びATPに合成されます。'},
   {q:'呼吸でグルコースが完全に分解されたとき、生じる物質の組み合わせは?',a:'二酸化炭素と水',w:['酸素と水','酸素とグルコース','乳酸と酸素'],ex:'呼吸:グルコース + 酸素 → 二酸化炭素 + 水 + エネルギー(ATP)。'}]},
 {n:'03',name:'酵素おやじ',kind:'ラーメン屋の頑固な店主',theme:'酵素',
  pre:[['foe','スープは温度が命だ。ぬるくても熱すぎてもダメなんだよ。'],['eto','へぇ。で、朝からラーメンは重いんで通っていいっすか。','01'],['foe','待て!酵素の最適温度も知らんやつに、この道は通さん!']],
  win:[['foe','…いい頭してるな。替え玉無料だ。'],['eto','だから朝は食わないっす。','15']],
  qs:[
   {q:'酵素が作用する相手の物質を何という?',a:'基質',w:['生成物','抗原','補酵素'],ex:'酵素は特定の基質とだけ結合して反応を促進します。反応でできた物質が生成物。'},
   {q:'酵素が特定の物質にしか作用しない性質を何という?',a:'基質特異性',w:['最適温度','失活','恒常性'],ex:'酵素の活性部位の形に合う基質だけが結合できるため、基質特異性が生じます。'},
   {q:'だ液に含まれ、デンプンを分解する酵素は?',a:'アミラーゼ',w:['ペプシン','リパーゼ','カタラーゼ'],ex:'アミラーゼはデンプンを分解。ペプシンはタンパク質、リパーゼは脂肪、カタラーゼは過酸化水素を分解します。'}]},
 {n:'04',name:'赤血球ライダー',kind:'バイク便の配達員',theme:'血液と酸素の運搬',
  pre:[['foe','お届けものでーす!酸素、全身にお届け中!'],['eto','全身真っ赤っすね。正直ダサいっす。','18'],['foe','なっ…!赤はヘモグロビンの色だぞ!勝負だ!']],
  win:[['foe','負けた…配達に戻ります…。'],['eto','安全運転でどうぞっす。','06']],
  qs:[

   {q:'血液の液体成分を何という?',a:'血しょう',w:['血ぺい','リンパ液','組織液'],ex:'血液 = 有形成分(赤血球・白血球・血小板)+ 液体成分(血しょう)。血しょうは栄養分や老廃物を運びます。'},
   {q:'ヘモグロビンが酸素を離しやすいのは、どんなところ?',a:'酸素が少なく二酸化炭素が多い',w:['酸素が多く二酸化炭素が少ない','どこでも変わらない','温度が低い'],ex:'活動している組織は酸素濃度が低く二酸化炭素濃度が高いので、ヘモグロビンは酸素を離し、組織に酸素がわたります。'}]},
 {n:'05',name:'かさぶた親方',kind:'左官職人',theme:'血液凝固',
  pre:[['foe','おう兄ちゃん、ケガしてねえか?傷口はオレがふさいでやる。'],['eto','ケガしてんの親方のほうっすよね。絆創膏だらけじゃないっすか。','08'],['foe','うるせえ!これは勲章だ!血液凝固で勝負しろ!']],
  win:[['foe','…固まったぜ、オレの完敗がな。'],['eto','うまくないっす。','19']],
  qs:[
   {q:'出血したとき傷口に集まり、血液凝固にはたらく血液の有形成分は?',a:'血小板',w:['赤血球','白血球','リンパ球'],ex:'血小板が傷口に集まり、血液凝固の反応が始まります。'},
   {q:'血液凝固のとき、血球をからめとる繊維状のタンパク質は?',a:'フィブリン',w:['ヘモグロビン','コラーゲン','ケラチン'],ex:'フィブリンが網のように血球をからめて、血ぺいをつくります。'},
   {q:'傷が治ったあと、血ぺいを溶かして取りのぞくしくみを何という?',a:'線溶(フィブリン溶解)',w:['食作用','拒絶反応','凝集'],ex:'血管が修復されると、フィブリンを分解する酵素がはたらいて血ぺいが溶かされます(線溶)。'}]},
 {n:'06',name:'ハート番長',kind:'学ランの番長',theme:'心臓と血液の循環',
  pre:[['foe','オレのハートが…ドクンドクンいってやがる…。てめぇ何者だ。'],['eto','通学中の者っす。それ、ただの拍動っす。','01'],['foe','なにぃ!?拍動だと…?詳しく聞かせてもらおうか!']],

function auInit(){
 try{
  if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; AU.ctx=new C();
    AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.on?0.6:0; AU.master.connect(AU.ctx.destination);
    const n=AU.ctx.sampleRate*0.3, buf=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; AU.noise=buf; }
  if(AU.ctx.state==='suspended') AU.ctx.resume();
  /* 最初のタップまでは音を出せない(ブラウザの決まり)ので、ここでタイトル曲を始める */
  if(AU.el&&AU.el.paused&&!document.hidden){ const pr=AU.el.play(); if(pr&&pr.catch) pr.catch(()=>{}); }
  else if(!AU.name&&state==='title') setTimeout(()=>{ if(state==='title') bgm('title'); },0);
 }catch(e){ AU.ctx=null; }
}
['click','pointerup','touchend','keydown'].forEach(n=>document.addEventListener(n,auInit,true));

const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(dest,f,t,d,type,vol){ const c=AU.ctx,o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+d); o.connect(g); g.connect(dest); o.start(t); o.stop(t+d+0.03); return o; }
function noise(t,d,vol){ const c=AU.ctx,s=c.createBufferSource(),g=c.createGain(); s.buffer=AU.noise; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+d); s.connect(g); g.connect(AU.master); s.start(t); s.stop(t+d+0.02); }
function seq(notes,step,type,vol,len){ const t0=AU.ctx.currentTime+0.01; notes.forEach((m,i)=>{ if(m) tone(AU.master,hz(m),t0+i*step,len||step*1.6,type,vol); }); }
function sfx(k){
 if(!AU.ctx||!AU.on) return;
 try{ const t=AU.ctx.currentTime+0.01;
  if(k==='click') tone(AU.master,900,t,0.05,'square',0.05);
  else if(k==='step') tone(AU.master,150,t,0.04,'triangle',0.08);
  else if(k==='enc'){ seq([72,0,72,0,79,84,91],0.07,'square',0.09); }
  else if(k==='ok') seq([79,84,88],0.07,'square',0.1);
  else if(k==='ng'){ const o=tone(AU.master,220,t,0.35,'sawtooth',0.1); o.frequency.exponentialRampToValueAtTime(110,t+0.3); }
  else if(k==='hit') noise(t,0.14,0.25);
  else if(k==='win') seq([72,76,79,84,0,79,84,88],0.11,'square',0.1,0.3);
  else if(k==='lose') seq([67,63,60,55,48],0.22,'triangle',0.14,0.4);
  else if(k==='tick') tone(AU.master,1250,t,0.06,'square',0.06);
  else if(k==='goal') seq([72,72,76,79,0,77,81,84,0,83,86,91],0.13,'square',0.1,0.35);
 }catch(e){}
}

/* 音楽ファイル:魔王魂(https://maou.audio/ 作曲 森田交一)。ゲームへの組み込みは規約で可、クレジットは任意(タイトルに表記)。
   曲だけを取り出して配るのは規約違反なので、bgm/ の中身を素材として配らないこと */
const BGM_FILES={title:'bgm/title.mp3',ride:'bgm/ride.mp3',battle:'bgm/battle.mp3',boss:'bgm/boss.mp3',class:'bgm/class.mp3'};
const BGM_VOL=0.45;
const BGM_NG={}; // 読みこめなかった曲(合成音で代用する)
function stopBgm(){ clearTimeout(AU.timer); AU.name=null; if(AU.bg){ try{ AU.bg.gain.value=0; AU.bg.disconnect(); }catch(e){} AU.bg=null; }
 if(AU.el){ try{ AU.el.pause(); AU.el.currentTime=0; }catch(e){} AU.el=null; } }
function bgm(name){
 if(AU.name===name) return; stopBgm();
 /* 曲のファイルが無いとき(GitHub Pages の公開版など)は、下の合成音で代わりに鳴らす */
 if(BGM_FILES[name]&&!BGM_NG[name]&&typeof Audio!=='undefined'){ try{ const el=new Audio(BGM_FILES[name]); el.loop=true; el.volume=BGM_VOL; el.muted=!AU.on;
   el.onerror=()=>{ BGM_NG[name]=1; if(AU.el===el){ AU.el=null; AU.name=null; bgm(name); } }; AU.el=el; AU.name=name; const pr=el.play(); if(pr&&pr.catch) pr.catch(()=>{}); return; }catch(e){} }
 if(!AU.ctx) return;
 try{ const c=AU.ctx, sg=SONGS[name]||SONGS.map, g=c.createGain(), spb=60/sg.bpm, tr=sg.tr||0; g.connect(AU.master); AU.bg=g; AU.name=name;
  let t=c.currentTime+0.08;
  (function sched(){ if(AU.bg!==g) return; if(c.state!=='running'){ AU.timer=setTimeout(sched,500); return; } let a=t,b=t;
    sg.lead.forEach(([m,l])=>{ if(m) tone(g,hz(m+tr),a,l*spb*0.92,sg.type,0.05); a+=l*spb; });
    sg.bass.forEach(([m,l])=>{ if(m) tone(g,hz(m+tr),b,l*spb*0.9,'triangle',0.11); b+=l*spb; });
    t=a; AU.timer=setTimeout(sched,Math.max(50,(t-c.currentTime-0.4)*1000)); })();
 }catch(e){}
}
/* クリアのジングル:ファイルがあれば1回だけ流し、無ければ合成音 */
function jingle(){ stopBgm(); if(BGM_FILES.clear&&typeof Audio!=='undefined'&&AU.on){ try{ const el=new Audio(BGM_FILES.clear); el.volume=BGM_VOL; const pr=el.play(); if(pr&&pr.catch) pr.catch(()=>sfx('goal')); return; }catch(e){} } sfx('goal'); }
function sndToggle(){ AU.on=!AU.on; auInit(); if(AU.master) AU.master.gain.value=AU.on?0.6:0; if(AU.el) AU.el.muted=!AU.on; $('snd').textContent=AU.on?'🔊':'🔇'; try{ localStorage.setItem('eto_snd',AU.on?'on':'off'); }catch(e){} }

/* タイミングゲージ(注射器):うでの上を左右に動く注射器を、血管(まん中)の上で止める。
   kind='atk'(攻撃):ずれが小さいほどダメージ倍率が高い。cb({m:倍率,t:判定,c:表示用class})
   kind='dodge'(回避):まん中で止めれば成功。cb(成功か) */
const GRADES=[[0.05,1.5,'クリティカル!!','crit'],[0.13,1.0,'ナイス!',''],[0.25,0.7,'ちょいズレ…','weak'],[1,0.5,'大ハズレ…','weak']];
const SYRINGE='<svg viewBox="0 0 30 60" width="42" height="84"><rect x="5" y="0" width="20" height="4" rx="2" fill="#33506b"/><rect x="13" y="4" width="4" height="10" fill="#9aa8b5"/><rect x="3" y="13" width="24" height="3" rx="1.5" fill="#33506b"/><rect x="7" y="16" width="16" height="26" rx="3" fill="#e8f6ff" stroke="#0d1b2a" stroke-width="2"/><rect x="9" y="27" width="12" height="13" fill="#ff6b8a"/><path d="M9 21h5M9 25h5M9 29h5M9 33h5" stroke="#0d1b2a" stroke-width="1"/><rect x="13" y="42" width="4" height="4" fill="#9aa8b5"/><line x1="15" y1="46" x2="15" y2="60" stroke="#6b7f95" stroke-width="1.8"/></svg>';
function gauge(kind,cb){
 const atk=kind==='atk', per=atk?1300:900, t0=performance.now(); let live=true;
 const pos=()=>{ const u=((performance.now()-t0)%per)/per; return u<0.5?u*2:2-u*2; };
 const okW=atk?0.26:0.22, crW=atk?0.10:0;
 const p=$('pane'); p.className='c1';
 p.innerHTML=`<div class="gauge ${kind}"><div class="arm"><div class="okz" style="left:${(0.5-okW/2)*100}%;width:${okW*100}%"></div>${crW?`<div class="vein" style="left:${(0.5-crW/2)*100}%;width:${crW*100}%"></div>`:''}</div><div class="syr" id="gmk">${SYRINGE}</div></div>`;
 const b=document.createElement('button'); b.className='main gbtn'; b.textContent=atk?'💉 ちゅうしゃ!(血管の上でタップ)':'💨 よける!(まん中でタップ)';
 const grade=d=>{ const g=GRADES.find(x=>d<=x[0]); return {m:g[1],t:g[2],c:g[3]}; };
 const end=d=>{ if(!live) return; live=false; b.disabled=true; b.style.display='none'; const m=$('gmk'); if(m&&m.classList) m.classList.add('poke');
   if(atk) cb(d===null?{m:0.5,t:'時間切れ…',c:'weak'}:grade(d)); else cb(d!==null&&d<=okW/2); };
 b.onclick=()=>{ sfx('click'); end(Math.abs(pos()-0.5)); }; p.appendChild(b);
 (function loop(){ if(!live) return; const m=$('gmk'); if(m&&m.style) m.style.left=(pos()*100)+'%'; requestAnimationFrame(loop); })();
 setTimeout(()=>end(null),atk?3000:2000);
}function popDmg(text,cls){ const d=document.createElement('div'); d.className='dmg '+(cls||''); d.textContent=text; $('battle').appendChild(d); setTimeout(()=>{ try{ d.remove(); }catch(e){} },1000); }
function afterAnswer(){ setBars(); setTimeout(()=>{ [...$('pane').children].filter(x=>x.textContent==='つぎへ ▶').forEach(x=>{ try{ x.remove(); }catch(e){} }); const b=document.createElement('button'); b.className='main'; b.style.gridColumn='1 / -1'; b.textContent='つぎへ ▶';
   b.onclick=()=>{ if(b.disabled) return; b.disabled=true; if(eHP<=0) winBattle(); else if(pHP<=0) loseBattle(); else ask(); };
   $('pane').appendChild(b); },400); }

 if(ok){
   combo++; const fast=sec<4; let dmg=10+(fast?3:0)+Math.min(6,(combo-1)*2); sfx('ok'); $('me').innerHTML=etoSVG('11');
   say(null,`正解!${fast?' ⚡はやい!':''}${combo>=2?` 🔥${combo}コンボ!`:''}\n注射器を 血管の上で止めろ!`); label('⭕ 正解!血管をねらえ');
   setTimeout(()=>gauge('atk',g=>{ dmg=Math.max(1,Math.round(dmg*g.m)); eHP-=dmg;
     sfx('hit'); anim($('me'),'atk'); setTimeout(()=>anim($('foe'),'hit'),200); popDmg(g.t+' -'+dmg,g.c); $('me').innerHTML=etoSVG(eHP<=0?(foe.boss?'20':'02'):g.m>=1?'11':'08');

     afterAnswer(); }),350);
 }else{
   btn.classList.add('wrong'); combo=0; bMiss++; addMiss(q); sfx('ng'); queue.push(q); $('me').innerHTML=etoSVG('13');
   say(null,`不正解…。正解は「${q.a}」。\n${foe.name}の こうげき!タイミングよく よけろ!`); label('❌ 不正解…よけろ!');
   setTimeout(()=>gauge('dodge',dodged=>{
     anim($('foe'),'atk2');

     afterAnswer(); }),350);
 }
 setBars();
}

 [...$('pane').children].forEach(b=>{ b.disabled=true; if(b.textContent===q.a) b.classList.add('right'); });
 if(ok){ tscore++; sfx('ok'); $('me').innerHTML=etoSVG('11'); say(null,'正解!',q.ex); label('⭕ 正解'); }
 else { btn.classList.add('wrong'); addMiss(q); sfx('ng'); $('me').innerHTML=etoSVG('16'); say(null,`不正解…。正解は「${q.a}」。`,q.ex); label('❌ 不正解'); }
 ti++; testBars();
 setTimeout(()=>{ const b=document.createElement('button'); b.className='main'; b.style.gridColumn='1 / -1'; b.textContent='つぎへ ▶';
   b.onclick=()=>{ sfx('click'); if(ti<5) return testAsk(false);
     if(tscore>=4){ stopBgm(); sfx('win'); $('me').innerHTML=etoSVG('20'); say(null,`5問中 ${tscore}問 正解。合格!`); return next(()=>talk(TEACHER.win,clear2)); }
     stopBgm(); sfx('lose'); $('me').innerHTML=etoSVG('09'); say('foe',`5問中 ${tscore}問 正解。合格は4問です。もう一度やりましょう。`); next(startTest,'再テストを受ける'); };
   $('pane').appendChild(b); },350);
}

function lineAnswer(p,t,btn,q){
 if(L.ans) return; L.ans=true; tStop(); markRight(q);
 const ok=t===q.a;
 if(ok){ const i=ahead3(); [L.line[i-1],L.line[i]]=[L.line[i],L.line[i-1]]; L.hit++; sfx('ok'); $('me').innerHTML=etoSVG('11'); anim($('foe'),'atk2');
   say(null,`正解!${p.name}に 順番をゆずってもらった!`,q.ex); label('⭕ 1人抜かした'); }
 else { if(btn) btn.classList.add('wrong'); L.miss++; p.rq.push(q); addMiss(q); sfx('ng'); $('me').innerHTML=etoSVG('16');

}

function faceAt(im,cx,cy,r,ring,sq){
 ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.clip(); ctx.fillStyle='#fff'; ctx.fillRect(cx-r,cy-r,r*2,r*2);
 if(im.complete&&im.naturalWidth){ const w=im.naturalWidth,h=im.naturalHeight; if(sq) ctx.drawImage(im,(w-h)/2,0,h,h,cx-r,cy-r,r*2,r*2); else ctx.drawImage(im,0,w*0.12,w,w,cx-r,cy-r,r*2,r*2); }
 ctx.restore(); ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.lineWidth=3; ctx.strokeStyle=ring; ctx.stroke();
}
function drawLine(){
 const top=34;
 ctx.fillStyle='#e9eef2'; ctx.fillRect(0,0,vw,vh);
 for(let y=top;y<vh;y+=28) for(let x=((y/28)&1)*28;x<vw;x+=56){ ctx.fillStyle='#dde4ea'; ctx.fillRect(x,y,28,28); }
 const ch=Math.max(70,Math.min(110,(vh-top)*0.24)), cw=Math.min(vw-16,380), cx0=(vw-cw)/2, cy0=top;
 ctx.fillStyle='#f6d7a7'; ctx.fillRect(0,cy0,vw,ch*0.55);
 ctx.fillStyle='#a8682f'; ctx.fillRect(cx0,cy0+ch*0.5,cw,ch*0.45); ctx.fillStyle='#7a4a21'; ctx.fillRect(cx0,cy0+ch*0.5,cw,ch*0.09);
 ctx.textAlign='center'; ctx.textBaseline='middle';
 ctx.fillStyle='#d7263d'; ctx.fillRect(vw/2-ch*0.75,cy0+ch*0.06,ch*1.5,ch*0.32); ctx.fillStyle='#fff'; ctx.font='900 '+ch*0.2+'px sans-serif'; ctx.fillText('購 買',vw/2,cy0+ch*0.22);
 faceAt(BOSS3.im,cx0+ch*0.42,cy0+ch*0.42,ch*0.34,'#d7263d');
 const bx0=cx0+ch*0.9, bs=Math.min(ch*0.3,(cw-ch*1.0)/BREAD0); ctx.font=bs+'px serif';
 for(let i=0;i<BREAD0;i++){ ctx.globalAlpha=i<L.bread?1:0.2; ctx.fillText('🥖',bx0+bs*(i+0.5),cy0+ch*0.74); } ctx.globalAlpha=1;
 const n=L.line.length, per=5, rows=Math.ceil(n/per), slot=Math.min((vw-16)/per,(vh-top-ch-24)/Math.max(rows,1)/1.15), r=slot*0.4, qy0=cy0+ch+slot*0.6;
 const pos=i=>{ const row=Math.floor(i/per), col=i%per, c=row%2?per-1-col:col; return [8+slot*(c+0.5), qy0+row*slot*1.15]; };
 ctx.strokeStyle='#9aa8b5'; ctx.lineWidth=4; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.moveTo(cx0+ch*0.42,cy0+ch*0.8); L.line.forEach((id,i)=>{ const [x,y]=pos(i); ctx.lineTo(x,y); }); ctx.stroke(); ctx.setLineDash([]);
 L.line.forEach((id,i)=>{ const [x,y]=pos(i);
   if(id==='eto'){ faceAt(etoIm,x,y,r*1.12,'#ffe14d',true); ctx.fillStyle='#ffe14d'; ctx.fillRect(x-slot*0.42,y+r*1.05,slot*0.84,slot*0.24); ctx.fillStyle='#0d1b2a'; ctx.font='900 '+slot*0.17+'px sans-serif'; ctx.fillText(i?'江藤くん':'江藤くん 先頭!',x,y+r*1.05+slot*0.12); }
   else { faceAt(Z3[id].im,x,y,r,i===0?'#d7263d':'#0d1b2a'); const bx=x-r*0.8, by=y-r*0.8;
     ctx.fillStyle=i===0?'#d7263d':'#0d1b2a'; ctx.beginPath(); ctx.arc(bx,by,slot*0.13,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='900 '+slot*0.15+'px sans-serif'; ctx.fillText(i+1,bx,by+1); }
   if(i===0&&id!=='eto'){ ctx.fillStyle='#d7263d'; ctx.font='900 '+slot*0.17+'px sans-serif'; ctx.fillText('先頭',x,y+r+slot*0.12); } });
}

     OK('肩をやさしくたたきながら、大声で呼びかける','「大丈夫ですか!」と呼びかけて反応を見る。目を開けない、返事がないなら「反応なし」'),
     NG('ほおを強くたたく','強くたたく必要はない。肩をやさしくたたき、大きな声で呼びかける'),
     NG('脈を1分間はかる','市民が行う救命では脈は確かめない。反応と呼吸で判断する'),
     NG('名前を思い出すまで考える','名前がわからなくても「大丈夫ですか!」でよい。すぐ反応を確かめる')],n),
  n=>step4pick('③ 助けを呼ぶ','反応がない!大声で助けを呼ぶ。周りの人に何をたのむ?(2つえらぶ)',[
     OK('ドナル先生、119番通報をお願いします!','だれかを指名して、具体的にたのむと確実に動いてもらえる'),
     OK('キビシ主任、AEDを持ってきてください!','AEDも、指名して持ってきてもらう'),
     NG('だれか、なんとかしてー!','「だれか」だと、みんなが「ほかの人がやるだろう」と思って動けないことがある。指名してたのむ'),
     NG('みんな、ここに集まって見てて!','人を集めるより、119番とAEDを具体的にたのむのが先')],2,n),
  n=>step4('④ 呼吸の確認','胸とおなかの動きを見る(10秒以内)。\n…しゃくりあげるような、途切れ途切れの呼吸をしている。',[
     OK('普段どおりの呼吸ではない → すぐ胸骨圧迫','しゃくりあげるような呼吸(死戦期呼吸)は心停止のサイン。普段どおりの呼吸がない・わからないときは、すぐ胸骨圧迫'),
     NG('呼吸しているので様子を見る','途切れ途切れの呼吸は、普段どおりの呼吸ではない。心停止と考えて胸骨圧迫を始める'),
     NG('回復の体位にして、救急車を待つ','普段どおりの呼吸がないので、待っていてはいけない。すぐ胸骨圧迫'),
     NG('人工呼吸だけを続ける','まず胸骨圧迫。人工呼吸は、訓練を受けていてできる場合に組み合わせる')],n,{timer:10,out:'10秒以上かかった。呼吸の確認は10秒以内。迷ったら胸骨圧迫を始める'}),
  n=>step4('⑤ 手を置く場所','胸骨圧迫を始める。手のひらの付け根を、どこに置く?',[
     OK('胸の真ん中(胸骨の下半分)','胸の真ん中に手のひらの付け根を置き、もう片方の手を重ねる。ひじをのばし、真上から押す'),
     NG('みぞおち','みぞおちを押すと内臓を傷つけるおそれがある。胸の真ん中'),
     NG('左胸(心臓の真上)','押すのは胸の真ん中。左にずらさない'),
     NG('のどのすぐ下','高すぎる。胸の真ん中(胸骨の下半分)')],n),
  n=>step4('⑥ 強さとテンポ','どのくらいの強さとテンポで押す?',[
     OK('深さ約5cm、1分間に100〜120回','深さ約5cm(6cmをこえない)、1分間に100〜120回。押したら毎回、胸をもとの高さまで戻す'),
     NG('深さ約1cm、1分間に60回','浅すぎて、おそすぎる。約5cm・100〜120回/分'),
     NG('深さ約10cm、1分間に200回','深すぎて、速すぎる。約5cm・100〜120回/分'),
     NG('10回押したら1分休む','止めると血液が流れなくなる。中断はできるだけ短く、押しつづける')],n),
  n=>compress4('⑦ 胸骨圧迫',30,n),
  n=>{ $('foe').innerHTML=cutImg(HELPERS.kibishi); step4('⑧ AEDが届いた','キビシ主任「AED、持ってきたわ!」\nまずすることは?',[
     OK('AEDの電源を入れる(ふたを開けると入る機種もある)','電源が入ると、音声が手順を教えてくれる。あとは音声の指示にしたがう'),
     NG('説明書を最初から全部読む','読んでいる時間はない。電源を入れれば音声が教えてくれる'),
     NG('胸骨圧迫をやめて、救急車を待つ','AEDを使い、胸骨圧迫も続ける。待つだけではいけない'),
     NG('AEDを本人から離れた場所に置く','AEDは本人のすぐそばに置いて使う')],()=>{ $('foe').innerHTML=foeArt(foe); n(); }); },
  n=>step4pick('⑨ 電極パッドを貼る','服を開いて、電極パッドを貼る。どこに貼る?(2つえらぶ)',[
     OK('右胸の上(鎖骨の下)','パッドの絵のとおり、心臓をはさむように貼る'),
     OK('左胸の下の横(わきの下)','パッドの絵のとおり、心臓をはさむように貼る'),
     NG('左胸の上','2枚で心臓をはさむように、右胸の上と左のわきの下に貼る'),
     NG('おなかの真ん中','おなかではなく、心臓をはさむ位置に貼る')],2,n,'胸がぬれていたらふく。貼り薬ははがす。肌にぴったり貼る'),
  n=>step4('⑩ 心電図の解析','AED「心電図を調べています。体に触れないでください」',[
     OK('体から離れ、周りの人にも離れてもらう','触れていると正しく解析できない。解析が終わるまで離れる'),
     NG('胸骨圧迫を続ける','解析中は触れない。終わったらすぐ再開する'),
     NG('パッドを手で押さえておく','触れると解析のじゃまになる。離れる'),
     NG('本人をゆさぶって起こす','解析中は触れない')],n),
  n=>step4('⑪ 電気ショック','AED「ショックが必要です。体から離れてください」',[
     OK('全員が離れたのを確かめてから、ショックボタンを押す','触れている人がいると感電する。「離れて!」と声をかけ、確かめてから押す'),
     NG('すぐにショックボタンを押す','周りの人が触れていないか、確かめてから押す'),
     NG('こわいので押さない','AEDは必要なときだけショックを指示する。指示にしたがって押す'),
     NG('パッドをはがしてから押す','パッドを貼ったまま押す')],n),
  n=>step4('⑫ ショックのあと','ショックが終わった。次は?',[
     OK('すぐに胸骨圧迫を再開する','ショックのあとは、すぐ胸骨圧迫。AEDは約2分ごとに解析するので、パッドは貼ったまま'),
     NG('呼吸がもどるか、しばらく様子を見る','様子を見ずに、すぐ胸骨圧迫を再開する'),
     NG('パッドをはがして片づける','パッドは貼ったまま。AEDが2分ごとに解析する'),
     NG('救急車が来るまで何もしない','救急隊に引き継ぐまで、胸骨圧迫とAEDを続ける')],n),
  n=>compress4('⑬ 救急隊が来るまで',20,n)
 ];
 let i=0; (function go(){ if(i>=S.length) return done(); S[i++](go); })();
}
/* ---- 手順の部品 ---- */
let F4={done:{},miss:0,c:false}, S4={opts:[],picked:[]}, T4=null;
function t4Stop(){ if(T4){ clearInterval(T4); T4=null; } }
function t4Start(sec,onOut){ t4Stop(); let left=sec*10; const show=()=>{ $('eBar').style.width=(left/(sec*10)*100)+'%'; $('eBar').className=left<=sec*3?'low':left<=sec*5?'mid':''; $('eLv').textContent='⏱ '+Math.ceil(left/10)+'秒'; }; show();
 T4=setInterval(()=>{ if(document.hidden) return; left--; show(); if(left>0&&left<=30&&left%10===0) sfx('tick'); if(left<=0){ t4Stop(); onOut(); } },100); }
function missBar(){ $('pBar').style.width=Math.max(0,100-F4.miss*20)+'%'; $('pBar').className=F4.miss>=3?'low':F4.miss?'mid':''; $('pNum').textContent=`まちがい ${F4.miss}`; }
function disableAll(){ [...$('pane').children].forEach(b=>b.disabled=true); }
function step4(title,q,opts,onOk,opt){
 opt=opt||{}; S4={opts,picked:[]}; state='battle'; t4Stop(); say(null,q); label(title,opt.timer?`${opt.timer}秒以内`:''); missBar();
 if(!opt.timer){ $('eLv').textContent=''; $('eBar').style.width='100%'; $('eBar').className=''; }
 const pick=(o,b)=>{ t4Stop(); disableAll();
   if(o.ok){ sfx('ok'); b.classList.add('right'); say(null,'⭕ '+o.r); label('⭕ 正解'); nextBtn(onOk); }
   else { F4.miss++; missBar(); sfx('ng'); b.classList.add('wrong'); say(null,'❌ '+o.r); label('❌ もう一度'); nextBtn(()=>step4(title,q,opts,onOk,opt)); } };
 buttons(shuffle(opts).map(o=>({t:o.t,f:b=>pick(o,b)})),1);
 if(opt.timer) t4Start(opt.timer,()=>{ disableAll(); F4.miss++; missBar(); sfx('ng'); say(null,'❌ '+opt.out); label('⏱ 時間切れ'); nextBtn(onOk); });
}
function step4pick(title,q,opts,need,onOk,after){
 S4={opts,picked:[]}; state='battle'; t4Stop(); say(null,q); label(title,`あと ${need}つ`); missBar(); $('eLv').textContent=''; $('eBar').style.width='100%'; $('eBar').className='';
 buttons(shuffle(opts).map(o=>({t:o.t,f:b=>{ b.disabled=true;
   if(o.ok){ S4.picked.push(o.t); sfx('ok'); b.classList.add('right'); const left=need-S4.picked.length;
     if(left<=0){ disableAll(); say(null,'⭕ '+o.r+(after?'\n'+after:'')); label('⭕ 正解'); nextBtn(onOk); } else { say(null,'⭕ '+o.r+`\nあと ${left}つ`); label(title,`あと ${left}つ`); } }
   else { F4.miss++; missBar(); sfx('ng'); b.classList.add('wrong'); say(null,'❌ '+o.r); } }})),1);
}
/* 胸骨圧迫のリズム:100〜120回/分(1回0.5〜0.6秒)に入った割合で判定 */
function compress4(title,n,onDone){
 state='battle'; S4={opts:[],picked:[]}; t4Stop(); const ts=[]; label(title,'目標 100〜120回/分');
 const ivs=()=>ts.slice(1).map((t,i)=>t-ts[i]);
 const show=()=>{ const last=ivs().slice(-4), bpm=last.length?Math.round(60000/(last.reduce((a,c)=>a+c,0)/last.length)):0;
   const j=!bpm?'':bpm<100?'🐢 おそい!':bpm>120?'🐇 はやい!':'👍 ちょうどいい'; say(null,`胸の真ん中を、ひじをのばして真上から押す!\nテンポ ${bpm||'-'}回/分 ${j}`,'1分間に100〜120回。1秒に2回より少し速いくらい');
   $('eLv').textContent=`${ts.length} / ${n}回`; $('eBar').style.width=(ts.length/n*100)+'%'; $('eBar').className=''; };
 const finish=()=>{ const iv=ivs(), good=iv.filter(x=>x>=500&&x<=600).length, pct=iv.length?Math.round(good/iv.length*100):0, avg=iv.length?Math.round(60000/(iv.reduce((a,c)=>a+c,0)/iv.length)):0;
   disableAll();
   if(pct>=50){ sfx('ok'); say(null,`⭕ 平均 ${avg}回/分(ちょうどいいテンポ ${pct}%)`,'深さは約5cm(6cmをこえない)。押したら毎回、胸をもとの高さまで戻す。疲れたら交代して、中断はできるだけ短く'); label('⭕ いいテンポ'); }
   else { F4.miss++; missBar(); sfx('ng'); say(null,`△ 平均 ${avg}回/分(ちょうどいいテンポ ${pct}%)`,'テンポは1分間に100〜120回。速すぎると胸が戻りきらず、おそすぎると血液が十分に流れない'); label('△ テンポがずれた'); }
   nextBtn(onDone); };
 buttons([{t:'👐 押す!',cls:'main',f:()=>{ if(ts.length>=n) return; ts.push(performance.now()); sfx('step'); anim($('me'),'atk'); show(); if(ts.length>=n) finish(); }}]); show();
}
/* ---- 画面 ---- */
function load4(){ try{ return JSON.parse(localStorage.getItem('eto_ep4')||'null')||{}; }catch(e){ return {}; } }
function save4(){ try{ localStorage.setItem('eto_ep4',JSON.stringify({done:F4.done,c:F4.c})); }catch(e){} }
const P4=()=>PEOPLE.filter(p=>p.ep===4);
function menu4(){
 const sv=load4(); if(!(sv.done&&Object.keys(sv.done).length)) return start4(true);
 label('第4話 体育編'); buttons([{t:`▶ つづきから(助けた ${Object.keys(sv.done).length}人)`,cls:'main',f:()=>start4(false)},{t:'はじめから(名鑑の記録は残る)',f:()=>start4(true)},{t:'もどる',f:title}]);
}
function start4(fresh){
 EP=4; padStop(); tStop(); t4Stop(); const sv=fresh?{}:load4(); F4={done:sv.done||{},miss:0,c:!!sv.c}; if(fresh) save4();
 $('title').style.display='none'; $('battle').style.display='none'; foe=null;
 if(fresh){ state='talk'; hud4(); talk(OP4,toField); } else toField();
}
function hud4(){ $('hudL').textContent='🏃 3時間目のグラウンド'; $('hudR').textContent=`助けた ${Object.keys(F4.done).length} / ${P4().length}`; }
function lastOpen(){ return P4().filter(p=>!p.last).every(p=>F4.done[p.id]); }
function toField(){
 padStop(); t4Stop(); state='map'; bgm('ride'); foe=null; $('msg').style.display='none'; $('battle').style.display='none'; $('battle').classList.remove('room','shop','field'); hud4();
 label('困っている人をえらぼう','単元:心臓と循環・救命処置');
 const list=P4().filter(p=>!p.last||lastOpen()).map(p=>({t:`${F4.done[p.id]?'✅':p.last?'🚨':'🆘'} ${p.name}(${p.kind})${F4.done[p.id]?' '+'★'.repeat(F4.done[p.id]):''}`,wide:true,cls:F4.done[p.id]?'':'main',f:()=>startCase(p)}));
 if(!lastOpen()) list.push({t:'🔒 ほかの人を助けると、何かが起こる…',wide:true,dis:true,f:()=>{}});
 list.push({t:'🎒 カバン',f:openBag},{t:'📒 名鑑',f:()=>openMeikan('all',toField)});
 buttons(list,2);
}
function scene4(p){ const b=$('battle'); b.style.display='block'; b.classList.remove('room','shop'); b.classList.add('field'); $('foe').className=''; $('me').className='';
 $('foe').innerHTML=foeArt(p); $('me').innerHTML=etoSVG(p.last?'12':'01'); $('eName').textContent=p.name; $('eLv').textContent=''; missBar(); }
function startCase(p){
 padStop(); t4Stop(); state='talk'; foe=p; F4.miss=0; $('pane').innerHTML=''; scene4(p); bgm(p.last?'test':'class'); label(`${p.kind}`);
 talk(p.pre,()=>p.run(()=>finishCase(p)));
}
function finishCase(p){
 t4Stop(); const st=F4.miss===0?3:F4.miss<=2?2:1; F4.done[p.id]=Math.max(F4.done[p.id]||0,st); HELP[p.id]=Math.max(HELP[p.id]||0,st); save4(); helpSave();
 stopBgm(); sfx('win'); $('me').innerHTML=etoSVG('02'); state='talk';
 talk(p.win,()=>{ say(null,`📒 ${p.name}を「助けた人名鑑」に記録した!\n評価 ${'★'.repeat(st)}${'☆'.repeat(3-st)}(まちがい ${F4.miss})`); label('📒 名鑑に記録');
   next(()=>{ if(P4().every(q=>F4.done[q.id])&&!F4.c) return clear4(); toField(); }); });
}
function clear4(){
 F4.c=true; save4(); $('battle').style.display='none'; state='talk'; foe=null; jingle(); label('🎉 第4話クリア');
 talk([[null,'キーンコーンカーンコーン…3時間目、終了。'],['eto','走るより、人を助けるほうがずっと疲れたっす。…でも、やってよかったっす。','15'],
   [null,'第4話クリア!\n※これはゲームでの練習。いざというときのために、消防署などの救命講習で実際に身につけよう。']],
  ()=>buttons([{t:'タイトルへもどる',cls:'main',f:title},{t:'📒 名鑑を見る',f:()=>openMeikan('all',title)}]));
}
function drawField(){
 const top=34, H=vh-top; ctx.fillStyle='#7ccf6b'; ctx.fillRect(0,0,vw,vh);
 ctx.save(); ctx.beginPath(); ctx.ellipse(vw/2,top+H*0.52,vw*0.42,H*0.38,0,0,7); ctx.lineWidth=Math.min(34,vw*0.08); ctx.strokeStyle='#d9774a'; ctx.stroke();
 ctx.lineWidth=1.5; ctx.strokeStyle='#fff'; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.ellipse(vw/2,top+H*0.52,vw*0.42,H*0.38,0,0,7); ctx.stroke(); ctx.restore();
 ctx.textAlign='center'; ctx.textBaseline='middle'; const r=Math.min(vw*0.1,H*0.11);
 P4().forEach(p=>{ if(p.last&&!lastOpen()) return; const x=vw*p.pos[0], y=top+H*p.pos[1], d=F4.done[p.id];
   faceAt(p.im,x,y,r,d?'#ffcf33':p.last?'#d7263d':'#0d1b2a');
   ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+r*0.8,y-r*0.8,r*0.34,0,7); ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#0d1b2a'; ctx.stroke();
   ctx.fillStyle=d?'#1f8a48':'#d7263d'; ctx.font='900 '+r*0.45+'px sans-serif'; ctx.fillText(d?'✓':'!',x+r*0.8,y-r*0.78);
   ctx.fillStyle='#0d1b2a'; ctx.font='800 '+Math.max(11,r*0.32)+'px sans-serif'; ctx.fillText(p.name,x,y+r+12); });
 faceAt(etoIm,vw*0.5,top+H*0.38,r*0.8,'#ffe14d',true);
}
/* ---- 助けた人名鑑:感謝の名鑑(全員)と美女名鑑(女性だけ) ---- */
function meikanStat(){ const n=PEOPLE.filter(p=>HELP[p.id]).length, s=PEOPLE.reduce((a,p)=>a+(HELP[p.id]||0),0); return {n,s,rate:Math.round(s/(PEOPLE.length*3)*100)}; }
function openMeikan(tab,back){
 padStop(); t4Stop(); state='dex'; $('title').style.display='none';
 const list=PEOPLE.filter(p=>tab==='all'||p.sex==='f'), st=meikanStat();
 $('note').innerHTML=`<h2>📒 助けた人名鑑 やり込み度 ${st.rate}%</h2><p class="by">${tab==='all'?'感謝の名鑑:助けたすべての人':'美女名鑑:助けた女性たち'} ・ 助けた ${list.filter(p=>HELP[p.id]).length}/${list.length}人 ・ ★は「まちがえずに助けた」ほど多い</p>`+
  list.map(p=>{ const h=HELP[p.id]; return `<div class="mkc ${h?'':'un'}"><img src="${p.img}" alt=""><div><b>${h?p.name:'???'}</b> <span class="st">${h?'★'.repeat(h)+'☆'.repeat(3-h):''}</span><br><i>${h?p.kind:'第'+p.ep+'話で出会えるかも'}</i>${h?`<p>😟 ${p.trouble}</p><p>💡 ${p.know}</p><p>💬「${p.thanks}」</p>`:''}</div></div>`; }).join('');
 $('note').style.display='block'; $('note').scrollTop=0; label('助けた人名鑑',tab==='all'?'感謝の名鑑':'美女名鑑');
 buttons([{t:'📒 感謝の名鑑',cls:tab==='all'?'main':'',f:()=>openMeikan('all',back)},{t:'🌸 美女名鑑',cls:tab==='f'?'main':'',f:()=>openMeikan('f',back)},{t:'とじる',wide:true,f:()=>{ $('note').style.display='none'; back(); }}],2);
}

/* ===== ゴール ===== */
function ending(){
 padStop(); state='talk'; foe=null; label('🚩 学校に到着!'); stopBgm(); jingle();
 CLEARS++; dexSave(); try{ localStorage.removeItem('eto_battle3'); }catch(e){}
 const st=dexStat();
 talk(ED.concat([[null,`通学編クリア!(${CLEARS}回目)\n図鑑のやり込み度 ${st.rate}%。次の通学では、また別の相手が待っている。`]]),()=>{ buttons([{t:'📖 図鑑を見る',f:()=>openDex(title)},{t:'タイトルへもどる',cls:'main',f:title}]); });
}

resize(); draw(); title();
