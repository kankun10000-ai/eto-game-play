<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ときめき江藤くん</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#2a1a2e;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;color:#2a1a2e}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#fff}
#top{flex:5;min-height:0;position:relative;overflow:hidden}
#bg{position:absolute;inset:0;background:linear-gradient(#ffd1e3,#fff3f8);transition:background .4s}
#pic{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);height:82%;max-width:88%;aspect-ratio:2/3.2;display:none}
#pic img{width:100%;height:100%;object-fit:contain;object-position:center bottom;border:4px solid #2a1a2e;border-radius:16px;background:linear-gradient(#fafafb,#d9dbe0 55%,#a9adb6);box-shadow:0 0 0 3px #fff,0 6px 0 rgba(42,26,46,.25)}
#pic.in{animation:pin .35s}
@keyframes pin{from{opacity:0;transform:translate(-50%,20px)}}
/* ホーム画面:左半分に江藤くん、右半分にステータス */
#pic.left{left:3%;top:40px;bottom:auto;transform:none;height:calc(96% - 40px - 54px);width:auto;max-width:46%}
/* 江藤くんの独り言(ホーム画面で、立ち絵の下を右から左へ流れる) */
#mono{position:absolute;left:3%;width:46%;bottom:4%;height:44px;overflow:hidden;background:#fff;border:3px solid #2a1a2e;border-radius:10px;display:none;z-index:2;box-shadow:0 4px 0 rgba(42,26,46,.25)}
#mono::before{content:"💭";position:absolute;left:4px;top:50%;transform:translateY(-50%);z-index:1;font-size:16px;background:#fff;padding-right:2px}
#mono span{position:absolute;top:50%;left:100%;white-space:nowrap;font-size:14px;font-weight:800;color:#2a1a2e;transform:translate(0,-50%);animation:mono 10s linear infinite}
@keyframes mono{from{left:100%;transform:translate(0,-50%)}to{left:0;transform:translate(-100%,-50%)}}
#pic.left.in{animation:pinL .35s}
@keyframes pinL{from{opacity:0;transform:translateY(20px)}}
#side{position:absolute;right:3%;top:40px;bottom:4%;width:47%;z-index:2;display:none;overflow:auto;background:rgba(255,255,255,.92);border:3px solid #2a1a2e;border-radius:12px;padding:7px 8px;font-size:12px;font-weight:800;color:#2a1a2e;box-shadow:0 4px 0 rgba(42,26,46,.25)}
#side h3{font-size:12.5px;color:#c2255c;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dotted #ff8fb8;padding-bottom:3px;margin-bottom:3px}
#side h3 small{font-size:10px;color:#7a3a5a}
#side .r{display:grid;grid-template-columns:5em 1fr 1.8em;align-items:center;gap:4px;margin-top:2px}
#side .r b{text-align:right;font-size:11px}
#side .bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;border:1.5px solid #2a1a2e}
#side .bar i{display:block;height:100%}
#side .her{display:flex;gap:6px;align-items:center;margin-top:5px}
#side .fc,#note .fc{border-radius:8px;border:2px solid #2a1a2e;background-color:#e9ecef;background-image:none;background-repeat:no-repeat;background-size:140% auto;flex:none}
#side .fc{width:62px;height:62px}
#side .her .bars{flex:1}
#side .her .bars .bar{margin-top:2px}
#side .money{margin-top:4px;font-size:11.5px;display:flex;justify-content:space-between}
#side .lover{color:#c2255c}
#hud{position:absolute;top:0;left:0;right:0;padding:6px 46px 6px 10px;font-size:12px;font-weight:800;color:#fff;background:rgba(42,26,46,.65);display:flex;justify-content:space-between;z-index:3}
#snd{position:absolute;top:3px;right:4px;z-index:9;width:36px;height:26px;font-size:14px;padding:0;border-radius:8px;box-shadow:none;background:rgba(255,255,255,.9)}
#msg{flex:none;background:#fff;border:3px solid #ff8fb8;border-radius:12px;padding:8px 10px;font-size:17px;font-weight:700;line-height:1.5;max-height:42%;overflow:auto;display:none}
#msg .who{display:inline-block;font-size:13px;color:#fff;background:#2a1a2e;border-radius:8px;padding:1px 8px;margin-bottom:3px}
#msg .who.eto{background:#e08a00}#msg .who.saki{background:#3b5bdb}#msg .who.yui{background:#d9480f}#msg .who.karui{background:#2b8a3e}#msg .who.etc{background:#6b7f95}
#msg .pf{float:left;width:64px;height:48px;object-fit:cover;border:3px solid #2a1a2e;border-radius:8px;margin:0 8px 2px 0}
#msg small{clear:both;display:block;margin-top:6px;padding-top:5px;border-top:1px dashed #c9a;font-size:14.5px;font-weight:500;color:#5c3d5e}
#note{position:absolute;inset:34px 6px 6px 6px;z-index:7;display:none;overflow:auto;background:#fff8fb;border:5px solid #c2255c;border-radius:12px;padding:12px 14px}
#note h2{font-size:18px;color:#c2255c;border-bottom:3px double #c2255c;padding-bottom:4px}
#note .by{font-size:12px;font-weight:700;color:#7a3a5a;margin-top:6px}
#note .row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:700}
#note .fc{width:72px;height:72px;border-width:3px}
#note .bar{flex:1;height:12px;background:#eee;border-radius:6px;overflow:hidden;border:2px solid #2a1a2e}
#note .bar i{display:block;height:100%}
#note ul{margin:8px 0 0 1.1em;font-size:14px;line-height:1.6;font-weight:600}
#title{position:absolute;inset:0;z-index:8;background:linear-gradient(#ff8fb8,#ffd1e3 55%,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
#title h1{font-size:30px;line-height:1.2;color:#fff;text-shadow:3px 3px 0 #c2255c,-2px -2px 0 #2a1a2e,2px -2px 0 #2a1a2e,-2px 2px 0 #2a1a2e}
#title h1 em{font-style:normal;font-size:40px;color:#fff3a8}
#title p{margin-top:8px;font-size:13px;font-weight:800;background:#2a1a2e;color:#ffd1e3;border-radius:12px;padding:3px 14px}
#title .duo{display:flex;gap:8px;margin-top:12px;height:44%}
#title .duo img{height:100%;aspect-ratio:2/3;object-fit:contain;object-position:center bottom;border:4px solid #2a1a2e;border-radius:14px;background:linear-gradient(#fafafb,#d9dbe0 55%,#a9adb6)}
#title .credit{position:absolute;bottom:4px;left:0;right:0;font-size:10px;font-weight:700;opacity:.7}
#title .sel{display:flex;gap:10px;margin-top:8px;height:62%;width:100%;justify-content:center}
#title .sel>div{flex:1;max-width:46%;display:flex;flex-direction:column;align-items:center;gap:4px}
#title .sel img{width:100%;flex:1;min-height:0;object-fit:contain;object-position:center bottom;border:4px solid #2a1a2e;border-radius:14px;background:linear-gradient(#fafafb,#d9dbe0 55%,#a9adb6)}
#title .sel b{font-size:15px;color:#2a1a2e}
#title .sel span{font-size:11px;font-weight:700;color:#5c3d5e;line-height:1.35}
.pop{position:absolute;left:50%;top:38%;transform:translateX(-50%);z-index:5;font-size:24px;font-weight:900;color:#fff;-webkit-text-stroke:1.5px #2a1a2e;text-shadow:0 3px 0 #2a1a2e;animation:pop 1.1s forwards;pointer-events:none;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px)}}
#bottom{flex:5;min-height:0;background:#2a1a2e;padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;border-top:4px solid #ff8fb8}
#lbl{color:#ffd1e3;font-size:12px;font-weight:800;display:flex;justify-content:space-between}
#pane{flex:1;min-height:0;display:grid;gap:7px;grid-template-columns:1fr;overflow-y:auto}
#pane.c2{grid-template-columns:1fr 1fr}
#pane.scroll{overflow-y:auto;grid-auto-rows:50px;align-content:start}
button{font-family:inherit;border:none;border-radius:12px;font-weight:800;font-size:15px;color:#2a1a2e;background:#fff;box-shadow:0 4px 0 #8a6a8e;padding:6px;line-height:1.3;white-space:pre-line;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a8e}
button.main{background:#ffd43b;box-shadow:0 4px 0 #b08900}
button.pink{background:#ff8fb8;box-shadow:0 4px 0 #a61e4d}
button.right{background:#69db7c;box-shadow:0 4px 0 #2b8a3e}
button.wrong{background:#ff8787;box-shadow:0 4px 0 #a61e1e}
button:disabled{opacity:.45}
#pane.menu button{font-size:14px;padding:4px}
/* 器具ならべ:上段=名前つきの枠4つ、下段=絵4枚 */
#pane.ord{grid-template-columns:repeat(4,1fr);grid-template-rows:1.25fr 1fr;gap:6px;overflow:hidden}
button.ordslot{min-height:0;padding:3px;display:flex;flex-direction:column;align-items:stretch;gap:3px;overflow:hidden;background:#5c3d5e;box-shadow:0 3px 0 #2a1a2e;color:#fff}
button.ordslot:active,button.ordpic:active{transform:none}
.ord-n{font-size:12px;line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center;word-break:keep-all;overflow-wrap:anywhere}
.ord-box{flex:1;min-height:0;border:2px dashed #e9b8cf;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;overflow:hidden}
button.ordslot.put .ord-box{border-style:solid;border-color:#ffd43b;background:#fff}
button.ordslot.ok{background:#2b8a3e}button.ordslot.ok .ord-box{border-color:#69db7c}
button.ordslot.ng{background:#a61e1e}button.ordslot.ng .ord-box{border-color:#ff8787}
button.ordpic{min-height:0;padding:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #ff8fb8}
button.ordpic.used{opacity:.25}
button.ordslot img,button.ordpic img{max-width:100%;max-height:100%;object-fit:contain}
.ord-e{font-size:32px}
/* バイクの縦スクロール(交通事故の行事) */
#cv{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:1}
#pane.ride{grid-template-rows:2fr 1fr}
#pane.ride button.pad{font-size:34px;background:#ffd43b;box-shadow:0 4px 0 #b08900}
/* 記録(名鑑・図鑑・友達) */
#note .mkc{display:flex;gap:10px;margin-top:10px;padding:8px;background:#fff;border:3px solid #2a1a2e;border-radius:12px;font-size:13px;line-height:1.45}
#note .mkc img{width:64px;height:84px;object-fit:contain;object-position:center bottom;border:2px solid #2a1a2e;border-radius:8px;background:linear-gradient(#fafafb,#d9dbe0 55%,#a9adb6);flex:none}
#note .mkc b{font-size:15px}
#note .mkc i{font-style:normal;color:#7a3a5a;font-weight:700}
#note .mkc p{margin-top:3px}
#note .mkc .st{color:#e8590c}
#note .mkc.un img{filter:brightness(0) opacity(.35)}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <div id="bg"></div><canvas id="cv"></canvas><div id="pic"><img alt=""></div><div id="side"></div><div id="mono"><span id="monoT"></span></div>
  <div id="hud"><span id="hudL"></span><span id="hudR"></span></div>
  <div id="note"></div>
  <button id="snd" onclick="sndToggle()">🔊</button>
  <div id="title"></div>
 </div>
 <div id="bottom"><div id="lbl"><span id="lblL"></span><span id="lblR"></span></div><div id="msg"></div><div id="pane"></div></div>
</div>
<script>
/* =====================================================================
   ときめき江藤くん(1年版) 設計書:docs/tokimeki_design.md
   ・最初にヒロインをえらぶ。4月第1週〜3月第4週の48週を前半・後半に分けた96ターン
   ・毎ターン1つ行動をえらぶ。行事・試験・告白チャンスは決まったターンに起こる(FIX)
   ・ほかのキャラのイベントが確率で起こる(OEV)。ヒロインの物語は全5章(CH)
   ・告白チャンスは年5回。💗・🤝・大事にする能力・章の達成で「告白される確率」が上がる(confessRate)
   ・恋人になっても進級試験に受からないと最高のエンドにならない
   ・旧『ガンバレ！江藤くん』の4話は、この1年の中の行動・行事・イベントとして入っている(下の「旧『ガンバレ！江藤くん』の物語」)
   ・人物は切り取らない元の構図で、黒枠つきのカードに出す
   ===================================================================== */
const VERSION='1.4';
const $=id=>document.getElementById(id);
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- 登場人物 ---------- */
const HER={
 saki:{name:'一ノ瀬サキ',short:'サキ',fy:'35%',need:'body',needName:'からだの知識',theme:'完ぺきじゃなくていい',prof:'クラス委員長。成績トップのがんばり屋で、少しツンとしている(20歳)'},
 yui:{name:'春日ユイ',short:'ユイ',fy:'31%',need:'care',needName:'思いやり',theme:'遅すぎる夢なんてない',prof:'元保育士の社会人入学。小児看護師をめざす、おだやかなお姉さん(26歳)'}
};
const himg=(k,e)=>`heroines/${k}_${e||1}.jpg`; // 1ふつう 2笑顔 3照れ 4心配
const WHO={eto:'江藤くん',saki:'サキ',yui:'ユイ',karui:'カルイ',gai:'ガイコツ先輩',anki:'アンキ',kibishi:'キビシ主任',donaru:'ドナル先生',yae:'ヤエさん',kizawa:'キザワ',mizuki:'ミズキ',honehara:'ホネハラ教授',miyabi:'ミヤビ先生',kouatsu:'コウアツ',sys:null};
const WHOIMG={karui:'chars/karui.jpg',gai:'chars/gai.jpg',anki:'chars/anki.jpg',kibishi:'chars/kibishi.jpg',donaru:'chars/donaru.jpg',yae:'chars/yae.jpg',kizawa:'chars/kizawa.jpg',mizuki:'chars/mizuki.jpg',honehara:'chars/honehara.jpg',miyabi:'zako/Z25.jpg',kouatsu:'zako/Z26.jpg'};
const ST_NAME={body:'からだの知識',med:'病気とくすり',skill:'看護技術',care:'思いやり',hp:'体力'};

/* ---------- 1年のこよみ:t=0〜95(週w=t/2、前半・後半) ---------- */
const TURNS=96;
const wOf=t=>Math.floor(t/2), halfOf=t=>t%2, mIdx=t=>Math.floor(wOf(t)/4); // mIdx 0=4月 … 11=3月
const monthNum=t=>((mIdx(t)+3)%12)+1;
const when=t=>`${monthNum(t)}月 第${wOf(t)%4+1}週 ${halfOf(t)?'後半':'前半'}`;
const tOf=(w,h)=>w*2+h;
/* 月ごとの授業の単元(null の月は、それまでの単元のまとめ) */
const UNIT_ORDER=['cell','bone','heart','drug',null,'resp','dig','kid','imm','nerve','drug',null]; // くすりは7月(基本)と2月(まとめ)の2回(2026-11-24〜)
const UNIT_NAME={cell:'細胞と生物の特徴',bone:'骨と筋肉',heart:'心臓と循環',resp:'呼吸とガス交換',dig:'消化と吸収',kid:'腎臓と体液・体温',imm:'免疫と感染',nerve:'神経とホルモン',drug:'くすりの基本'};
const UNIT_ST={imm:'med',drug:'med'}; // それ以外は body
function learnedUnits(t){ return UNIT_ORDER.slice(0,mIdx(t)+1).filter(Boolean); }
function unitNow(t){ return UNIT_ORDER[mIdx(t)]; }

/* ---------- 状態 ---------- */
let G=null, state='title';
function newGame(k){ return {her:k,t:0,st:{body:0,med:0,skill:0,care:0,hp:0},stress:0,money:3000,friend:0,gai:0,
 h:{saki:{love:0,trust:0,ch:0,last:-9},yui:{love:0,trust:0,ch:0,last:-9}},lover:false,declined:false,exam1:null,exam2:null,
 miss:[],cool:{},once:{},sick:false,actDone:false,fixDone:{}}; }
let ENDS={}, ALBUM={};
try{ ENDS=JSON.parse(localStorage.getItem('tk_ends2')||'{}'); ALBUM=JSON.parse(localStorage.getItem('tk_album')||'{}'); }catch(e){}
function saveG(){ try{ localStorage.setItem('tk_save2',JSON.stringify(G)); }catch(e){} }
function loadG(){ try{ return JSON.parse(localStorage.getItem('tk_save2')||'null'); }catch(e){ return null; } }
function album(id){ if(!ALBUM[id]){ ALBUM[id]=1; try{ localStorage.setItem('tk_album',JSON.stringify(ALBUM)); }catch(e){} } }
const H=()=>G.h[G.her], HN=()=>HER[G.her].short;

/* ---------- 画面の部品 ---------- */
function label(l,r){ $('lblL').textContent=l; $('lblR').textContent=r||''; }
/* 背景:Apple Image Playground で作った絵(bg/*.webp)。読みこめないときは下の色が見える */
const BGIMG=['school','lib','park','night','pink','hall','room','winter','summer','hosp'];
function bg(kind){ if(!BGIMG.includes(kind)) kind='pink'; const g={school:'linear-gradient(#cfe8ff,#f4f9ff)',lib:'linear-gradient(#e9d8c4,#fbf3e8)',park:'linear-gradient(#bfe9ff 0 55%,#9bd67f 55%)',night:'linear-gradient(#2b1b4e,#a35d9e)',pink:'linear-gradient(#ffd1e3,#fff3f8)',hall:'linear-gradient(#ffe8a3,#fff8e0)',room:'linear-gradient(#d3f9d8,#f4fff6)',winter:'linear-gradient(#dbe4ff,#f8f9ff)',summer:'linear-gradient(#ffd8a8 0 50%,#ffe066 50%)',hosp:'linear-gradient(#e3fafc,#f8f9fa)'}[kind]; $('bg').style.background=`linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),url(bg/${kind}.webp) center/cover no-repeat,${g}`; }
let curPic='';
const cutSrc=s=>s.replace(/\.jpg$/,'.webp');
function pic(src){ const p=$('pic'); if(!src){ p.style.display='none'; curPic=''; return; } if(src!==curPic){ const im=p.querySelector('img'); im.onerror=()=>{ im.onerror=null; im.src=src; }; im.src=cutSrc(src); p.classList.remove('in'); void p.offsetWidth; p.classList.add('in'); curPic=src; } p.style.display='block'; }
/* 江藤くんの立ち絵(1ふつう 2笑顔 3照れ 4困り)。セリフの顔番号から近いものをえらぶ。'c1'〜'c4' で直接指定 */
const etoCard=e=>`chars/eto_${e}.jpg`;
const FACE2CARD={'02':2,'06':2,'11':2,'15':2,'20':2,'07':3,'04':4,'08':4,'09':4,'13':4,'16':4,'17':4};
const cardOf=f=>/^c[1-4]$/.test(f||'')?+f[1]:(FACE2CARD[f]||1);
const avatarOf=f=>/^c[1-4]$/.test(f||'')?{c1:'01',c2:'02',c3:'07',c4:'13'}[f]:(f||'01');
function say(who,text,face,extra){
 const m=$('msg'); m.style.display='block'; const name=who==='foe'?(foe&&foe.name):(WHO[who]||null);
 m.innerHTML=(who==='eto'?`<img class="pf" src="faces/${avatarOf(face)}.jpg" alt="">`:'')+(name?`<span class="who ${['eto','saki','yui','karui'].includes(who)?who:'etc'}">${name}</span><br>`:'')+text.replace(/\n/g,'<br>')+(extra?`<small>${extra}</small>`:'');
 m.scrollTop=0;
 if(who==='foe'&&foe&&foe.img){ home(false); pic(foe.img); return; } // 旧作の人物(いま話している相手)
 if(who==='saki'||who==='yui'||WHOIMG[who]) home(false);
 if(who==='saki'||who==='yui') pic(himg(who,face)); else if(WHOIMG[who]) pic(WHOIMG[who]);
 else if(who==='eto'&&(!curPic||curPic.includes('chars/eto_'))) pic(etoCard(cardOf(face)));
}
function buttons(list,cols,cls){ const p=$('pane'); p.className=(cols===2?'c2':'')+(cls?' '+cls:''); p.innerHTML=''; p.scrollTop=0;
 list.forEach(o=>{ const b=document.createElement('button'); b.textContent=o.t; if(o.cls) b.className=o.cls; if(o.wide) b.style.gridColumn='1 / -1'; if(o.dis) b.disabled=true; b.onclick=()=>{ sfx('click'); o.f(b); }; p.appendChild(b); }); }
function next(f,t){ buttons([{t:t||'つぎへ ▶',cls:'main',f:b=>{ if(b.disabled) return; b.disabled=true; f(); }}]); }
function talk(lines,done){ let i=0; (function step(){ if(i>=lines.length) return done(); const [w,t,fc]=lines[i++]; say(w,t,fc); next(step); })(); }
function disableAll(){ [...$('pane').children].forEach(b=>b.disabled=true); }
function nextBtn(f){ setTimeout(()=>{ [...$('pane').children].filter(x=>x.textContent==='つぎへ ▶').forEach(x=>{ try{ x.remove(); }catch(e){} }); const b=document.createElement('button'); b.className='main'; b.style.gridColumn='1 / -1'; b.textContent='つぎへ ▶'; b.onclick=()=>{ if(b.disabled) return; b.disabled=true; sfx('click'); f(); }; $('pane').appendChild(b); },300); }
function clearPane(){ [...$('pane').children].filter(x=>!/\b(right|wrong)\b/.test(x.className||'')).forEach(x=>{ try{ x.remove(); }catch(e){} }); }

const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const toMidi=s=>{ const m=/^([A-G][#b]?)(\d)$/.exec(s); return m?12*(+m[2]+1)+NOTE[m[1]]:null; };
/* 楽譜を読む:[{step,m,len}]、和音 [{root,tri}] */
function songParse(s){ if(s._p) return s._p; const tk=s.mel.trim().split(/\s+/), notes=[];
 tk.forEach((t,i)=>{ const m=toMidi(t); if(m===null) return; let len=1; while(tk[i+len]==='-') len++; notes.push({step:i,m,len}); });
 const chords=s.chords.trim().split(/\s+/).map(c=>{ const x=/^([A-G][#b]?)(m?)$/.exec(c), r=NOTE[x[1]]; return {root:r,tri:(x[2]?[0,3,7]:[0,4,7]).map(v=>v+r)}; });
 return s._p={notes,chords,steps:tk.length}; }
let SYN_T=null, SYN_G=null;
function synthStop(){ clearTimeout(SYN_T); SYN_T=null; if(SYN_G){ try{ SYN_G.gain.setTargetAtTime(0,AU.ctx.currentTime,0.05); const g=SYN_G; setTimeout(()=>{ try{ g.disconnect(); }catch(e){} },400); }catch(e){} SYN_G=null; } }
function synTone(dest,m,at,d,type,vol){ const c=AU.ctx,o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=440*Math.pow(2,(m-69)/12);
 g.gain.setValueAtTime(0.0001,at); g.gain.linearRampToValueAtTime(vol,at+0.01); g.gain.exponentialRampToValueAtTime(0.0008,at+d); o.connect(g); g.connect(dest); o.start(at); o.stop(at+d+0.03); }
function synPad(dest,m,at,d,vol){ const c=AU.ctx,o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=440*Math.pow(2,(m-69)/12);
 g.gain.setValueAtTime(0.0001,at); g.gain.linearRampToValueAtTime(vol,at+0.15); g.gain.setValueAtTime(vol,at+d*0.7); g.gain.linearRampToValueAtTime(0.0001,at+d); o.connect(g); g.connect(dest); o.start(at); o.stop(at+d+0.05); }
function synDrum(dest,k,at){ const c=AU.ctx;
 if(k==='k'){ const o=c.createOscillator(),g=c.createGain(); o.frequency.setValueAtTime(130,at); o.frequency.exponentialRampToValueAtTime(40,at+0.12); g.gain.setValueAtTime(0.35,at); g.gain.exponentialRampToValueAtTime(0.001,at+0.16); o.connect(g); g.connect(dest); o.start(at); o.stop(at+0.2); return; }
 if(!AU.noise){ const b=c.createBuffer(1,c.sampleRate*0.3,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.noise=b; }
 const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=AU.noise; f.type='highpass'; f.frequency.value=k==='h'?7000:1500;
 const v=k==='h'?0.05:0.14, d=k==='h'?0.04:0.12; g.gain.setValueAtTime(v,at); g.gain.exponentialRampToValueAtTime(0.001,at+d); s.connect(f); f.connect(g); g.connect(dest); s.start(at); s.stop(at+d+0.02); }
function synthPlay(name){ synthStop(); const c=AU.ctx, s=SONGS[name]; if(!c||!s) return; const p=songParse(s);
 const g=c.createGain(); g.gain.value=AU.on?0.55:0; g.connect(c.destination); SYN_G=g; const spb=60/s.bpm/2, bar=spb*8; let t=c.currentTime+0.08;
 (function loop(){ if(SYN_G!==g) return; if(c.state!=='running'){ SYN_T=setTimeout(loop,400); return; }
   try{
    p.notes.forEach(n=>synTone(g,n.m,t+n.step*spb,n.len*spb*0.95,s.lw,s.lv));
    p.chords.forEach((ch,b)=>{ const t0=t+b*bar;
      if(s.bass) for(let i=0;i<8;i+=s.bass) synTone(g,36+ch.root+(ch.root>7?-12:0)+(s.bass===1&&i%2?12:0),t0+i*spb,spb*s.bass*0.9,'triangle',0.11);
      if(s.arp) for(let i=0;i<8;i++) synTone(g,60+ch.tri[i%3]+(i>=3&&i<6?12:0),t0+i*spb,spb*0.9,'triangle',0.025);
      else ch.tri.forEach(m=>synPad(g,60+m,t0,bar,0.03));
      for(let i=0;i<8;i++){ const k=s.drum[i]; if(k&&k!=='.') synDrum(g,k,t0+i*spb); } });
   }catch(e){}
   t+=p.chords.length*bar; SYN_T=setTimeout(loop,Math.max(50,(t-c.currentTime-0.4)*1000)); })(); }
function auInit(){ try{ if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(C) AU.ctx=new C(); } if(AU.ctx&&AU.ctx.state==='suspended') AU.ctx.resume();

 seq.forEach(([f,d])=>{ const o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0.12,tt); g.gain.exponentialRampToValueAtTime(0.001,tt+d); o.connect(g); g.connect(c.destination); o.start(tt); o.stop(tt+d+0.02); tt+=d; }); }catch(e){} }

let QNOW=null, CHOICE=null, VOLNOW=null;
const qKey=q=>q.q;
/* units の中から n 問。review=true なら「まちがいノート」を優先 */
function quiz(n,title,cb,asker,units,review){
 let pool=QB.filter(q=>!units||units.includes(q.u));
 let list=[]; if(review){ const m=pool.filter(q=>G.miss.includes(qKey(q))); list=shuffle(m).slice(0,n); }
 list=list.concat(shuffle(pool.filter(q=>!list.includes(q)))).slice(0,n);
 let i=0, ok=0, got=[];
 (function ask(){ if(i>=n||i>=list.length){ QNOW=null; return cb(ok,got); } const q=list[i++]; QNOW=q;
   say(asker||'sys',`【${i}/${Math.min(n,list.length)}】${q.q}`,asker==='saki'||asker==='yui'?1:null); label(title,`正解 ${ok}`);
   buttons(shuffle([q.a,...q.w]).map(t=>({t,f:b=>{ disableAll(); const good=t===q.a; [...$('pane').children].forEach(x=>{ if(x.textContent===q.a) x.classList.add('right'); });
     if(good){ ok++; got.push(q); sfx('ok'); G.miss=G.miss.filter(k=>k!==qKey(q)); say('sys','⭕ 正解!',null,q.ex); }
     else { b.classList.add('wrong'); sfx('ng'); if(!G.miss.includes(qKey(q))) G.miss.push(qKey(q)); say('sys',`❌ 正解は「${q.a}」`,null,q.ex); }
     nextBtn(ask); }})),2); })();
}

 return out.length&&Math.random()<0.7?out:base; }

/* ---------- 器具ならべ(旧作の注射器のゲージから、神経衰弱をへて変更) ----------
   上段に器具の名前4つ、下段に絵4枚。絵を名前の順にタップしてならべる(置いた絵の枠をタップで外せる)。時間制限なし。
   order(kind,cb):cb({n:正しくならべた数, all:4つ全部か, miss:まちがえた器具}) */
function toolImgErr(img){ const id=img.dataset.id; if(!img.dataset.jpg){ img.dataset.jpg=1; img.src='tools/'+id+'.jpg'; return; }
 const t=TOOLS.find(x=>x.id===id); img.outerHTML='<b class="ord-e">'+(t?t.e:'❓')+'</b>'; }
const toolImg=t=>`<img src="tools/${t.id}.webp" data-id="${t.id}" alt="" onerror="toolImgErr(this)">`;
let ORD=null;
function order(kind,cb){
 const ans=shuffle(TOOLS.slice()).slice(0,4); ORD={ans,put:[null,null,null,null]}; let live=true;
 const p=$('pane'); p.className='ord'; p.innerHTML=''; p.scrollTop=0;
 const slots=ans.map((t,i)=>{ const b=document.createElement('button'); b.className='ordslot'; b.dataset.i=i;
   b.onclick=()=>{ if(!live||!ORD.put[i]) return; sfx('click'); ORD.put[i]=null; draw(); }; p.appendChild(b); return b; });
 const pics=shuffle(ans.slice()).map(t=>{ const b=document.createElement('button'); b.className='ordpic'; b.dataset.id=t.id; b.innerHTML=toolImg(t);
   b.onclick=()=>{ if(!live||ORD.put.includes(t)) return; const i=ORD.put.indexOf(null); if(i<0) return; sfx('click'); ORD.put[i]=t; draw(); if(!ORD.put.includes(null)) finish(); };
   p.appendChild(b); return b; });
 function draw(){
   slots.forEach((b,i)=>{ const t=ORD.put[i]; b.className='ordslot'+(t?' put':'');
     b.innerHTML=`<span class="ord-n">${i+1}. ${ans[i].name}</span><span class="ord-box">${t?toolImg(t):''}</span>`; });
   pics.forEach(b=>{ const used=ORD.put.some(t=>t&&t.id===b.dataset.id); b.className='ordpic'+(used?' used':''); b.disabled=used; });
 }
 function finish(){ live=false; const ok=ans.map((t,i)=>ORD.put[i]===t), n=ok.filter(Boolean).length;
   slots.forEach((b,i)=>{ b.className='ordslot put '+(ok[i]?'ok':'ng'); }); sfx(n===4?'ok':'ng');
   setTimeout(()=>{ p.className=''; p.innerHTML=''; cb({n,all:n===4,miss:ans.filter((t,i)=>!ok[i])}); },900); }
 draw();
}

   [['飲み忘れない工夫を、一緒に考えましょう。お薬カレンダーはどうですか?',2,'責めずに、生活に合わせた工夫を一緒に考える。お薬カレンダーや一包化は飲み忘れ防止に役立つ'],['忘れた分は、次に2回分まとめて飲めば大丈夫っす',-2,'2回分をまとめて飲むと、効きすぎて危険。忘れたときの飲み方は医師・薬剤師に確認する'],['飲み忘れるなんて、だめっすよ',-1,'責めるだけでは解決しない。続けられる工夫を考える']],
   {q:'薬の飲み忘れを防ぐ工夫として、よく使われるのは?',a:'お薬カレンダーや一包化',w:['気づいたら2回分まとめて飲む','調子がいい日は飲まない','家族の薬と一緒の袋に入れる'],ex:'飲む時間ごとに分けて見える化する。1回分ずつまとめる一包化は、薬剤師にたのめる。'}],

   [['おいしいですよね。量を少し減らして、酢やだしで味をつける工夫もありますよ',2,'好きなものを否定せず、減塩の工夫を提案する。高血圧では塩分をとりすぎないことが大切'],['漬物なんて体に悪いから、ぜんぶやめるっす',-1,'いきなり全部やめるのは続かない。少しずつ減らす工夫を'],['薬を飲んでるから、塩分は気にしなくていいっす',-2,'薬を飲んでいても、減塩は治療の基本']],

  [[['foe','血圧の薬が変わってから、朝おきると、ふらっとするのよ。'],['eto','それ、危ないっす。','13']],

   {q:'降圧薬を飲んでいる高齢者の転倒を防ぐ声かけは?',a:'起きるときは座ってからゆっくり立つ',w:['朝はすばやく立ち上がる','ふらついたら薬を2倍にする','夜は明かりを消して歩く'],ex:'急に立つと血圧が下がって、ふらつき・転倒の原因になる。'}]]),
 PT('P03','ソウタくん','ぜんそくで入院中の男の子(9歳)','恐竜が大好き。将来の夢は恐竜博士',[

  [[['foe','あした、たいいん!江藤にいちゃん、これあげる。ティラノサウルスの絵!'],['eto','うまいっす!オレの宝物にするっす。','20']],

 PT('P04','リコさん','足を骨折した大学生のバスケ選手(20歳)','チームのエース。負けずぎらいで、リハビリも全力',[

 PT('P05','タケダさん','胃かいようで入院中の会社員(45歳)','仕事人間。入院中もスマホで会議に出ようとする',[

 PT('P06','ヨシオ先生','認知症のある元高校教師(84歳)','40年間、生物を教えていた。ときどき教室にいると思っている',[

function rideResize(){ if(!ctx) return; const r=$('top').getBoundingClientRect(), d=window.devicePixelRatio||1; vw=r.width; vh=r.height; cv.width=vw*d; cv.height=vh*d; ctx.setTransform(d,0,0,d,0,0); }

 state='ride'; home(false); pic(null); $('msg').style.display='none'; if(cv&&cv.style){ cv.style.display='block'; rideResize(); }

 buttons([{t:'◀',cls:'pad',f:()=>rideMove('l')},{t:'▶',cls:'pad',f:()=>rideMove('r')},{t:'▼ ゆっくり',f:()=>rideMove('d')},{t:'▲ はやく',f:()=>rideMove('u')}],2,'ride');
 requestAnimationFrame(rideLoop); }
function rideLoop(){ if(!RIDE.on) return; const now=performance.now(), dt=Math.min(0.05,(now-(RIDE.last||now))/1000); RIDE.last=now;

function rideMove(d){ if(state!=='ride') return;
 if(d==='l') RIDE.lane=Math.max(0,RIDE.lane-1); else if(d==='r') RIDE.lane=Math.min(2,RIDE.lane+1);

     else if(R1.inv<=0){ R1.hits++; R1.inv=1.2; R1.crash=0.6; o.gone=true; ridePop('いてっ!',o.lane,0.7,'#c92a2a'); sfx('ng'); } } });

function faceAt(im,cx,cy,r,ring){ ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.clip(); ctx.fillStyle='#fff'; ctx.fillRect(cx-r,cy-r,r*2,r*2);

 ctx.fillStyle='rgba(42,26,46,.5)'; ctx.fillRect(0,top,vw,6); ctx.fillStyle='#ffd43b'; ctx.fillRect(0,top,vw*Math.min(1,RIDE.dist/RIDE.goal),6);

function accidentEvent(){ state='talk'; gx(); home(false); bg('park'); bgm('ride'); album('fx_jiko'); const k=G.her, P=PEOPLE.find(p=>p.id==='p_jiko'), met=G.road.b.includes('04');

 const steps=()=>{ const S=[
   n=>step4('① まず何をする?','倒れている配達員のそばを、車が走りぬけていく。まず何をする?',[

     NG('道路の真ん中に走って飛び出し、すぐに抱きおこす','車にひかれるおそれがある。まず周りの安全。首や背中のけがも考えて、むやみに起こさない'),
     NG('スマホで現場の写真をとる','写真より先に、安全の確保と通報と手当て'),
     NG('自分にはむりなので、そのまま学校へ向かう','そばにいる人の行動が命をつなぐ。安全を確かめて、助けを呼ぶ')],n),
   n=>{ foe=NAMIDA; pic(NAMIDA.img); step4('② 助けを呼ぶ','ナミダ「うぇぇん…ど、どうしよう…」\n泣いているナミダに、何をたのむ?',[
     OK('「ナミダさん、119番に電話して!『救急です、交通事故です』って伝えて!」','人を指名して、具体的にたのむ。119番では「救急」と場所・ようすを伝える(警察には119番から連絡してもらえることもある)'),
     NG('「だれか、なんとかしてー!」と叫ぶ','「だれか」だと、みんなが「ほかの人がやるだろう」と思って動けないことがある。指名してたのむ'),
     NG('「泣いてないで、帰っていいっすよ」','人手は多いほどいい。落ちついて、できることをたのむ'),
     NG('通報はあとにして、まず全部自分でやる','手当てと同時に、通報を人にたのむ。救急車は早く呼ぶほどいい')],()=>{ foe=P; pic(P.img); n(); }); },
   n=>step4('③ 声をかける','「大丈夫ですか!」と声をかけると、うめき声で返事をした。首が痛いと言っている。どうする?',[
     OK('首や体をむやみに動かさないようにして、声をかけつづける','首や背中のけががあるかもしれない。危ない場所でなければ、そのままの姿勢で動かさない'),
     NG('すぐに起こして、歩道まで歩かせる','首や背中のけがが悪化するおそれ。危険が迫っていなければ動かさない'),
     NG('ヘルメットを急いで引っぱって外す','首を動かしてしまうおそれ。呼吸の確認や心肺蘇生に必要なとき以外は、むりに外さない'),
     NG('水を飲ませる','けがの具合がわからないうちは、飲食させない')],n),
   n=>{ foe=YAKIN; talk([['sys','そこへ、通勤帰りらしい男性が走ってきた。'],['foe','…夜勤明けの看護師だ。手伝う。…きみ、いい判断だ。首は動かすな。'],['eto','ヤキン先輩!?(卒業生の…)たすかるっす!','06']],()=>{ foe=P; pic(P.img); n(); }); },
   n=>step4('④ 出血','ズボンのひざから下が、血でぬれている。どう止血する?',[
     OK('清潔なガーゼやハンカチを当て、ビニール袋などで手を覆って、強く押さえる','直接圧迫止血。血液に直接さわらないよう、手袋やビニール袋を使う。血がにじんできたら、布を重ねて押さえつづける'),

     NG('血を洗い流すため、水をかけつづける','流しつづけても止血にならない。清潔な布で強く押さえる')],n),
   n=>step4('⑤ 救急車を待つあいだ','止血しながら、救急車を待っている。ほかにすることは?',[
     OK('上着などで体をおおって保温し、声をかけて意識や呼吸のようすを見守る','体が冷えると状態が悪くなる。保温し、声をかけて変化を見る。反応がなくなり、普段どおりの呼吸がなければ心肺蘇生'),
     NG('寝ないように、体を強くゆさぶる','首や体を動かしてしまう。声をかけて見守る'),
     NG('痛み止めの薬を飲ませる','飲食や薬はあたえない。救急隊にまかせる'),
     NG('もう大丈夫そうなので、その場を離れる','救急隊に引き継ぐまで、そばで見守る')],n),
   n=>step4('⑥ 救急隊が到着','サイレンが聞こえ、救急隊が到着した。どうする?',[
     OK('見たこととしたこと(倒れていた様子・意識・出血と止血・首の痛み)を伝える','救急隊は、そばにいた人の情報で手当てを決める。いつ・どうなっていて・何をしたかを短く伝える'),
     NG('何も言わずに、だまって学校へ行く','見たことを伝えるのも大事な手当てのひとつ'),
     NG('「たぶん骨折です」と自分の考えだけを伝える','見たこと・したことを、そのまま伝える'),
     NG('救急隊の前で、止血をやめて手を離す','引き継ぎの合図があるまで、押さえつづける')],n)
  ]; let i=0; (function go(){ if(i>=S.length) return fin(); S[i++](go); })(); };
 const fin=()=>{ tmStop(); const st=F4miss===0?3:F4miss<=2?2:1; HELP[P.id]=Math.max(HELP[P.id]||0,st); G.p4[P.id]=st; recSave(); sfx('love');
   const a=addSt('skill',3+st), c=addSt('care',2+st); if(hits>=3) addStress(5); foe=YAKIN;
   talk([['sys','赤血球ライダーは、救急車で病院へ運ばれた。'],['foe','…落ちついていたな。看護学生か。いい看護師になれ。じゃあ、オレは寝る。'],['eto','先輩、立ったまま寝てるっす…。','08'],
     [null,`📒 赤血球ライダーを「助けた人名鑑」に記録した!\n評価 ${'★'.repeat(st)}${'☆'.repeat(3-st)}(まちがい ${F4miss})\n看護技術 +${a}、思いやり +${c}`],
     [k,k==='saki'?'…聞いたわよ、今朝の事故。止血して、救急隊に引き継いだって。…ちょっと、見直した。':'今朝、事故の人を助けたんだって?…江藤くん、えらかったね。けがはない?',k==='saki'?3:2],
     ['sys','※これはゲームでの練習。実際の応急手当ては、消防署や日本赤十字社の講習で身につけよう。']],()=>{ addLove(k,6,st>=2?6:2); fixEnd(); }); };
 talk([['sys','7月。夏休み前の朝。今日は久しぶりにバイクで通学だ。'],['eto','安全運転でいくっす。','06'],['sys','◀▶で車線を変えて🚧をよけよう。▲▼で速さを変えられる。🍙を取ると落ちつく。']],()=>
  rideStart({goal:8,hard:1,mark:'🙋',label:'🛵 バイク通学(◀▶ 車線/▲▼ 速さ)'},h1=>{ hits+=h1; foe=NAMIDA; home(false);
   talk([['sys','道のわきで、学生が手をふっている。'],['foe','うぇぇん…!そ、その先の交差点で、バイクの人が転んで…動かないんですぅ…!'],['eto','マジっすか!すぐ行くっす!ナミダさんも来てほしいっす!','13']],()=>
    rideStart({goal:7,hard:4,mark:'🚨',bgm:'emergency',label:'🚨 事故の現場へ急げ!(🚧に注意)'},h2=>{ hits+=h2; scene(); })); })); }

/* ---------- 記録:助けた人名鑑・通学路の図鑑・クラスの友達(タイトルとメニューから) ---------- */
function openRec(tab,back){ state='note'; $('title').style.display='none'; $('msg').style.display='none'; gx();
 const card=(img,name,sub,body,seen)=>`<div class="mkc ${seen?'':'un'}"><img src="${cutSrc(img)}" onerror="this.onerror=null;this.src='${img}'" alt=""><div><b>${seen?name:'???'}</b> ${sub}${body}</div></div>`;
 let h='';
 if(tab==='help'||tab==='f'){ const list=PEOPLE.filter(p=>tab==='help'||p.sex==='f');
   h=`<h2>📒 助けた人名鑑</h2><p class="by">${tab==='help'?'感謝の名鑑:助けたすべての人':'美女名鑑:助けた女性たち'} ・ 助けた ${list.filter(p=>HELP[p.id]).length}/${list.length}人 ・ ★は「まちがえずに助けた」ほど多い</p>`+
    list.map(p=>{ const s=HELP[p.id]; return card(p.img,p.name,s?`<span class="st">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span><br><i>${p.kind}</i>`:`<br><i>${p.where||'6月の体育で出会えるかも'}</i>`,s?`<p>😟 ${p.trouble}</p><p>💡 ${p.know}</p><p>💬「${p.thanks}」</p>`:'',s); }).join(''); }
 if(tab==='road'){ const won=FOES.filter(f=>DEX[f.n]&&DEX[f.n].w).length;
   h=`<h2>🛵 通学路の図鑑 ${won}/${FOES.length}</h2><p class="by">行動「🛵 通学路」で出会う相手。★はノーミスで勝った相手</p>`+
    FOES.map(f=>{ const d=DEX[f.n]; return card(f.img,f.name,d?`${d.p?'<span class="st">★</span>':''}<br><i>${f.kind}・${f.theme}${d.w?'':'(まだ勝っていない)'}</i>`:'',d?`<p>💬「${f.win[0][1]}」</p>`:'',!!d); }).join(''); }
 if(tab==='pt'){ const s=G?G.pt||{}:{}, done=PATIENTS.filter(p=>PTREC[p.id]>=3).length;
   h=`<h2>🏥 患者さん ${done}/${PATIENTS.length}</h2><p class="by">行動「🏥 病院ボランティア」で出会う患者さん。3回訪ねると退院を見送れる</p>`+
    PATIENTS.map(p=>{ const r=PTREC[p.id]||0; return card(p.img,p.name,r?`<span class="st">${r>=3?'🌸退院':'💬'.repeat(r)}</span><br><i>${p.kind}</i>`:'',r?`<p>${p.meet}</p><p>💡 ${p.ep.slice(0,r).map(e=>e[2].a).join(' / ')}</p>`:'<br><i>病院ボランティアで出会えるかも</i>',r>0); }).join(''); }
 if(tab==='mate'){ const f=G?G.mt.f:[];
   h=`<h2>👥 クラスの友達 ${f.length}/${MATES.length}</h2><p class="by">${G?'休み時間に話しかけてくる。9人と友達になると、ハヤカワ先生の小テスト':'ゲームを始めると記録される(1年ごと)'}</p>`+
    MATES.map(m=>{ const fr=f.includes(m.id), hh=G?(G.mt.h[m.id]||0):0; return card(m.img,m.name,fr?'<span class="st">💛</span>':hh?`<span class="st">${'♥'.repeat(hh)}</span>`:'',`<br><i>${fr?m.prof:hh?'友好度 '+hh+' / 3':'まだ話していない'}</i>`,fr||hh); }).join(''); }
 $('note').innerHTML=h; $('note').style.display='block'; $('note').scrollTop=0; label('記録',{help:'感謝の名鑑',f:'美女名鑑',road:'通学路の図鑑',mate:'クラスの友達',pt:'患者さん'}[tab]);
 const tb=(t,k)=>({t,cls:tab===k?'main':'',f:()=>openRec(k,back)});
 buttons([tb('📒 感謝の名鑑','help'),tb('🌸 美女名鑑','f'),tb('🛵 通学路の図鑑','road'),tb('👥 クラスの友達','mate'),tb('🏥 患者さん','pt'),{t:'とじる',f:()=>{ $('note').style.display='none'; back(); }}],2); }

};
function ending(id){ const e=ENDINGS.find(x=>x.id===id); ENDS[id]=1; try{ localStorage.setItem('tk_ends2',JSON.stringify(ENDS)); localStorage.removeItem('tk_save2'); }catch(e2){} state='ending'; album('end_'+id);

 talk(END_TEXT[id],()=>{ sfx('love'); pic(null); say('sys',`🎬 ${e.name}\n\n見たエンディング ${Object.keys(ENDS).length} / ${ENDINGS.length}\n思い出アルバム ${Object.keys(ALBUM).length}枚`); label('🎬 エンディング');
  buttons([{t:'タイトルへもどる',cls:'main',f:title},{t:'🎞 エンディング一覧',f:openEnds}],1); });

 $('note').innerHTML=`<h2>🎞 エンディング一覧 ${Object.keys(ENDS).length}/${ENDINGS.length}</h2><ul>${ENDINGS.map(e=>`<li>${ENDS[e.id]?'✅ '+e.name:'??? (まだ見ていない)'}</li>`).join('')}</ul><p class="by">思い出アルバム ${Object.keys(ALBUM).length}枚。ヒント:告白されるには💗と🤝の両方と、ヒロインが大事にする能力(サキ=からだの知識、ユイ=思いやり)。恋人になっても、進級試験に受かってこそ最高のエンド!</p>`;
