<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ときめき江藤くん</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#2a1a2e;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;color:#2a1a2e}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#fff}
#top{flex:5;min-height:0;position:relative;overflow:hidden}
#bg{position:absolute;inset:0;background:linear-gradient(#ffd1e3,#fff3f8);transition:background .4s}
#pic{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);height:82%;max-width:88%;aspect-ratio:2/3.2;display:none}
#pic img{width:100%;height:100%;object-fit:contain;object-position:center bottom;border:4px solid #2a1a2e;border-radius:16px;background:linear-gradient(#fafafb,#d9dbe0 55%,#a9adb6);box-shadow:0 0 0 3px #fff,0 6px 0 rgba(42,26,46,.25)}
#pic.in{animation:pin .35s}
@keyframes pin{from{opacity:0;transform:translate(-50%,20px)}}
/* ホーム画面:左半分に江藤くん、右半分にステータス */
#pic.left{left:3%;top:40px;bottom:auto;transform:none;height:calc(96% - 40px - 54px);width:auto;max-width:46%}
/* 江藤くんの独り言(ホーム画面で、立ち絵の下を右から左へ流れる) */
#mono{position:absolute;left:3%;width:46%;bottom:4%;height:44px;overflow:hidden;background:#fff;border:3px solid #2a1a2e;border-radius:10px;display:none;z-index:2;box-shadow:0 4px 0 rgba(42,26,46,.25)}
#mono::before{content:"💭";position:absolute;left:4px;top:50%;transform:translateY(-50%);z-index:1;font-size:16px;background:#fff;padding-right:2px}
#mono span{position:absolute;top:50%;left:100%;white-space:nowrap;font-size:14px;font-weight:800;color:#2a1a2e;transform:translate(0,-50%);animation:mono 10s linear infinite}
@keyframes mono{from{left:100%;transform:translate(0,-50%)}to{left:0;transform:translate(-100%,-50%)}}
#pic.left.in{animation:pinL .35s}
@keyframes pinL{from{opacity:0;transform:translateY(20px)}}
#side{position:absolute;right:3%;top:40px;bottom:4%;width:47%;z-index:2;display:none;overflow:auto;background:rgba(255,255,255,.92);border:3px solid #2a1a2e;border-radius:12px;padding:7px 8px;font-size:12px;font-weight:800;color:#2a1a2e;box-shadow:0 4px 0 rgba(42,26,46,.25)}
#side h3{font-size:12.5px;color:#c2255c;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dotted #ff8fb8;padding-bottom:3px;margin-bottom:3px}
#side h3 small{font-size:10px;color:#7a3a5a}
#side .r{display:grid;grid-template-columns:5em 1fr 1.8em;align-items:center;gap:4px;margin-top:2px}
#side .r b{text-align:right;font-size:11px}
#side .bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;border:1.5px solid #2a1a2e}
#side .bar i{display:block;height:100%}
#side .her{display:flex;gap:6px;align-items:center;margin-top:5px}
#side .fc,#note .fc{border-radius:8px;border:2px solid #2a1a2e;background-color:#e9ecef;background-image:none;background-repeat:no-repeat;background-size:140% auto;flex:none}
#side .fc{width:62px;height:62px}
#side .her .bars{flex:1}
#side .her .bars .bar{margin-top:2px}
#side .money{margin-top:4px;font-size:11.5px;display:flex;justify-content:space-between}
#side .lover{color:#c2255c}
#hud{position:absolute;top:0;left:0;right:0;padding:6px 46px 6px 10px;font-size:12px;font-weight:800;color:#fff;background:rgba(42,26,46,.65);display:flex;justify-content:space-between;z-index:3}
#snd{position:absolute;top:3px;right:4px;z-index:9;width:36px;height:26px;font-size:14px;padding:0;border-radius:8px;box-shadow:none;background:rgba(255,255,255,.9)}
#msg{flex:none;background:#fff;border:3px solid #ff8fb8;border-radius:12px;padding:8px 10px;font-size:17px;font-weight:700;line-height:1.5;max-height:42%;overflow:auto;display:none}
#msg .who{display:inline-block;font-size:13px;color:#fff;background:#2a1a2e;border-radius:8px;padding:1px 8px;margin-bottom:3px}
#msg .who.eto{background:#e08a00}#msg .who.saki{background:#3b5bdb}#msg .who.yui{background:#d9480f}#msg .who.karui{background:#2b8a3e}#msg .who.etc{background:#6b7f95}
#msg .pf{float:left;width:64px;height:48px;object-fit:cover;border:3px solid #2a1a2e;border-radius:8px;margin:0 8px 2px 0}
#msg small{clear:both;display:block;margin-top:6px;padding-top:5px;border-top:1px dashed #c9a;font-size:14.5px;font-weight:500;color:#5c3d5e}
#note{position:absolute;inset:34px 6px 6px 6px;z-index:7;display:none;overflow:auto;background:#fff8fb;border:5px solid #c2255c;border-radius:12px;padding:12px 14px}
#note h2{font-size:18px;color:#c2255c;border-bottom:3px double #c2255c;padding-bottom:4px}
#note .by{font-size:12px;font-weight:700;color:#7a3a5a;margin-top:6px}
#note .row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:700}
#note .fc{width:72px;height:72px;border-width:3px}
#note .bar{flex:1;height:12px;background:#eee;border-radius:6px;overflow:hidden;border:2px solid #2a1a2e}
#note .bar i{display:block;height:100%}
#note ul{margin:8px 0 0 1.1em;font-size:14px;line-height:1.6;font-weight:600}
#title{position:absolute;inset:0;z-index:8;background:linear-gradient(#ff8fb8,#ffd1e3 55%,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
#title h1{font-size:30px;line-height:1.2;color:#fff;text-shadow:3px 3px 0 #c2255c,-2px -2px 0 #2a1a2e,2px -2px 0 #2a1a2e,-2px 2px 0 #2a1a2e}
#title h1 em{font-style:normal;font-size:40px;color:#fff3a8}
#title p{margin-top:8px;font-size:13px;font-weight:800;background:#2a1a2e;color:#ffd1e3;border-radius:12px;padding:3px 14px}
#title .duo{display:flex;gap:8px;margin-top:12px;height:44%}
#title .duo img{height:100%;aspect-ratio:2/3;object-fit:contain;object-position:center bottom;border:4px solid #2a1a2e;border-radius:14px;background:linear-gradient(#fafafb,#d9dbe0 55%,#a9adb6)}
#title .credit{position:absolute;bottom:4px;left:0;right:0;font-size:10px;font-weight:700;opacity:.7}
#title .sel{display:flex;gap:10px;margin-top:8px;height:62%;width:100%;justify-content:center}
#title .sel>div{flex:1;max-width:46%;display:flex;flex-direction:column;align-items:center;gap:4px}
#title .sel img{width:100%;flex:1;min-height:0;object-fit:contain;object-position:center bottom;border:4px solid #2a1a2e;border-radius:14px;background:linear-gradient(#fafafb,#d9dbe0 55%,#a9adb6)}
#title .sel b{font-size:15px;color:#2a1a2e}
#title .sel span{font-size:11px;font-weight:700;color:#5c3d5e;line-height:1.35}
.pop{position:absolute;left:50%;top:38%;transform:translateX(-50%);z-index:5;font-size:24px;font-weight:900;color:#fff;-webkit-text-stroke:1.5px #2a1a2e;text-shadow:0 3px 0 #2a1a2e;animation:pop 1.1s forwards;pointer-events:none;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px)}}
#bottom{flex:5;min-height:0;background:#2a1a2e;padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;border-top:4px solid #ff8fb8}
#lbl{color:#ffd1e3;font-size:12px;font-weight:800;display:flex;justify-content:space-between}
#pane{flex:1;min-height:0;display:grid;gap:7px;grid-template-columns:1fr;overflow-y:auto}
#pane.c2{grid-template-columns:1fr 1fr}
#pane.scroll{overflow-y:auto;grid-auto-rows:50px;align-content:start}
button{font-family:inherit;border:none;border-radius:12px;font-weight:800;font-size:15px;color:#2a1a2e;background:#fff;box-shadow:0 4px 0 #8a6a8e;padding:6px;line-height:1.3;white-space:pre-line;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a8e}
button.main{background:#ffd43b;box-shadow:0 4px 0 #b08900}
button.pink{background:#ff8fb8;box-shadow:0 4px 0 #a61e4d}
button.right{background:#69db7c;box-shadow:0 4px 0 #2b8a3e}
button.wrong{background:#ff8787;box-shadow:0 4px 0 #a61e1e}
button:disabled{opacity:.45}
#pane.menu button{font-size:14px;padding:4px}
.gauge{position:relative;height:56px;align-self:center;background:#fff0f6;border:3px solid #ff8fb8;border-radius:14px;overflow:hidden}
.gauge .ok{position:absolute;top:0;bottom:0;background:rgba(105,219,124,.6)}
.gauge .best{position:absolute;top:0;bottom:0;background:rgba(59,91,219,.7)}
.gauge .mk{position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;background:#c2255c;border:2px solid #2a1a2e;border-radius:4px}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <div id="bg"></div><div id="pic"><img alt=""></div><div id="side"></div><div id="mono"><span id="monoT"></span></div>
  <div id="hud"><span id="hudL"></span><span id="hudR"></span></div>
  <div id="note"></div>
  <button id="snd" onclick="sndToggle()">🔊</button>
  <div id="title"></div>
 </div>
 <div id="bottom"><div id="lbl"><span id="lblL"></span><span id="lblR"></span></div><div id="msg"></div><div id="pane"></div></div>
</div>
<script>
/* =====================================================================
   ときめき江藤くん(1年版) 設計書:docs/tokimeki_design.md
   ・最初にヒロインをえらぶ。4月第1週〜3月第4週の48週を前半・後半に分けた96ターン
   ・毎ターン1つ行動をえらぶ。行事・試験・告白チャンスは決まったターンに起こる(FIX)
   ・ほかのキャラのイベントが確率で起こる(OEV)。ヒロインの物語は全5章(CH)
   ・告白チャンスは年5回。💗・🤝・大事にする能力・章の達成で「告白される確率」が上がる(confessRate)
   ・恋人になっても進級試験に受からないと最高のエンドにならない
   ・画像は新作のフォルダ(faces/ chars/ heroines/)だけを使い、本編とは分けている。音は本編の ../bgm を使う
   ===================================================================== */
const VERSION='0.24';
const $=id=>document.getElementById(id);
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- 登場人物 ---------- */
const HER={
 saki:{name:'一ノ瀬サキ',short:'サキ',fy:'35%',need:'body',needName:'からだの知識',theme:'完ぺきじゃなくていい',prof:'クラス委員長。成績トップのがんばり屋で、少しツンとしている(20歳)'},
 yui:{name:'春日ユイ',short:'ユイ',fy:'31%',need:'care',needName:'思いやり',theme:'遅すぎる夢なんてない',prof:'元保育士の社会人入学。小児看護師をめざす、おだやかなお姉さん(26歳)'}
};
const himg=(k,e)=>`heroines/${k}_${e||1}.jpg`; // 1ふつう 2笑顔 3照れ 4心配
const WHO={eto:'江藤くん',saki:'サキ',yui:'ユイ',karui:'カルイ',gai:'ガイコツ先輩',anki:'アンキ',kibishi:'キビシ主任',donaru:'ドナル先生',yae:'ヤエさん',kizawa:'キザワ',mizuki:'ミズキ',honehara:'ホネハラ教授',sys:null};
const WHOIMG={karui:'chars/karui.jpg',gai:'chars/gai.jpg',anki:'chars/anki.jpg',kibishi:'chars/kibishi.jpg',donaru:'chars/donaru.jpg',yae:'chars/yae.jpg',kizawa:'chars/kizawa.jpg',mizuki:'chars/mizuki.jpg',honehara:'chars/honehara.jpg'};
const ST_NAME={body:'からだの知識',med:'病気とくすり',skill:'看護技術',care:'思いやり',hp:'体力'};

/* ---------- 1年のこよみ:t=0〜95(週w=t/2、前半・後半) ---------- */
const TURNS=96;
const wOf=t=>Math.floor(t/2), halfOf=t=>t%2, mIdx=t=>Math.floor(wOf(t)/4); // mIdx 0=4月 … 11=3月
const monthNum=t=>((mIdx(t)+3)%12)+1;
const when=t=>`${monthNum(t)}月 第${wOf(t)%4+1}週 ${halfOf(t)?'後半':'前半'}`;
const tOf=(w,h)=>w*2+h;
/* 月ごとの授業の単元(null の月は、それまでの単元のまとめ) */
const UNIT_ORDER=['cell','bone','heart',null,null,'resp','dig','kid','imm','nerve','drug',null];
const UNIT_NAME={cell:'細胞と生物の特徴',bone:'骨と筋肉',heart:'心臓と循環',resp:'呼吸とガス交換',dig:'消化と吸収',kid:'腎臓と体液・体温',imm:'免疫と感染',nerve:'神経とホルモン',drug:'くすりの基本'};
const UNIT_ST={imm:'med',drug:'med'}; // それ以外は body
function learnedUnits(t){ return UNIT_ORDER.slice(0,mIdx(t)+1).filter(Boolean); }
function unitNow(t){ return UNIT_ORDER[mIdx(t)]; }

/* ---------- 状態 ---------- */
let G=null, state='title';
function newGame(k){ return {her:k,t:0,st:{body:0,med:0,skill:0,care:0,hp:0},stress:0,money:3000,friend:0,gai:0,
 h:{saki:{love:0,trust:0,ch:0,last:-9},yui:{love:0,trust:0,ch:0,last:-9}},lover:false,declined:false,exam1:null,exam2:null,
 miss:[],cool:{},once:{},sick:false,actDone:false,fixDone:{}}; }
let ENDS={}, ALBUM={};
try{ ENDS=JSON.parse(localStorage.getItem('tk_ends2')||'{}'); ALBUM=JSON.parse(localStorage.getItem('tk_album')||'{}'); }catch(e){}
function saveG(){ try{ localStorage.setItem('tk_save2',JSON.stringify(G)); }catch(e){} }
function loadG(){ try{ return JSON.parse(localStorage.getItem('tk_save2')||'null'); }catch(e){ return null; } }
function album(id){ if(!ALBUM[id]){ ALBUM[id]=1; try{ localStorage.setItem('tk_album',JSON.stringify(ALBUM)); }catch(e){} } }
const H=()=>G.h[G.her], HN=()=>HER[G.her].short;

/* ---------- 画面の部品 ---------- */
function label(l,r){ $('lblL').textContent=l; $('lblR').textContent=r||''; }
function bg(kind){ $('bg').style.background={school:'linear-gradient(#cfe8ff,#f4f9ff)',lib:'linear-gradient(#e9d8c4,#fbf3e8)',park:'linear-gradient(#bfe9ff 0 55%,#9bd67f 55%)',night:'linear-gradient(#2b1b4e,#a35d9e)',pink:'linear-gradient(#ffd1e3,#fff3f8)',hall:'linear-gradient(#ffe8a3,#fff8e0)',room:'linear-gradient(#d3f9d8,#f4fff6)',winter:'linear-gradient(#dbe4ff,#f8f9ff)',summer:'linear-gradient(#ffd8a8 0 50%,#ffe066 50%)',hosp:'linear-gradient(#e3fafc,#f8f9fa)'}[kind]||'linear-gradient(#ffd1e3,#fff3f8)'; }
let curPic='';
const cutSrc=s=>s.replace(/\.jpg$/,'.webp');
function pic(src){ const p=$('pic'); if(!src){ p.style.display='none'; curPic=''; return; } if(src!==curPic){ const im=p.querySelector('img'); im.onerror=()=>{ im.onerror=null; im.src=src; }; im.src=cutSrc(src); p.classList.remove('in'); void p.offsetWidth; p.classList.add('in'); curPic=src; } p.style.display='block'; }
/* 江藤くんの立ち絵(1ふつう 2笑顔 3照れ 4困り)。セリフの顔番号から近いものをえらぶ。'c1'〜'c4' で直接指定 */
const etoCard=e=>`chars/eto_${e}.jpg`;
const FACE2CARD={'02':2,'06':2,'11':2,'15':2,'20':2,'07':3,'04':4,'08':4,'09':4,'13':4,'16':4,'17':4};
const cardOf=f=>/^c[1-4]$/.test(f||'')?+f[1]:(FACE2CARD[f]||1);
const avatarOf=f=>/^c[1-4]$/.test(f||'')?{c1:'01',c2:'02',c3:'07',c4:'13'}[f]:(f||'01');
function say(who,text,face,extra){
 const m=$('msg'); m.style.display='block'; const name=WHO[who]||null;
 m.innerHTML=(who==='eto'?`<img class="pf" src="faces/${avatarOf(face)}.jpg" alt="">`:'')+(name?`<span class="who ${['eto','saki','yui','karui'].includes(who)?who:'etc'}">${name}</span><br>`:'')+text.replace(/\n/g,'<br>')+(extra?`<small>${extra}</small>`:'');
 m.scrollTop=0;
 if(who==='saki'||who==='yui'||WHOIMG[who]) home(false);
 if(who==='saki'||who==='yui') pic(himg(who,face)); else if(WHOIMG[who]) pic(WHOIMG[who]);
 else if(who==='eto'&&(!curPic||curPic.includes('chars/eto_'))) pic(etoCard(cardOf(face)));
}
function buttons(list,cols,cls){ const p=$('pane'); p.className=(cols===2?'c2':'')+(cls?' '+cls:''); p.innerHTML=''; p.scrollTop=0;
 list.forEach(o=>{ const b=document.createElement('button'); b.textContent=o.t; if(o.cls) b.className=o.cls; if(o.wide) b.style.gridColumn='1 / -1'; if(o.dis) b.disabled=true; b.onclick=()=>{ sfx('click'); o.f(b); }; p.appendChild(b); }); }
function next(f,t){ buttons([{t:t||'つぎへ ▶',cls:'main',f:b=>{ if(b.disabled) return; b.disabled=true; f(); }}]); }
function talk(lines,done){ let i=0; (function step(){ if(i>=lines.length) return done(); const [w,t,fc]=lines[i++]; say(w,t,fc); next(step); })(); }
function disableAll(){ [...$('pane').children].forEach(b=>b.disabled=true); }
function nextBtn(f){ setTimeout(()=>{ [...$('pane').children].filter(x=>x.textContent==='つぎへ ▶').forEach(x=>{ try{ x.remove(); }catch(e){} }); const b=document.createElement('button'); b.className='main'; b.style.gridColumn='1 / -1'; b.textContent='つぎへ ▶'; b.onclick=()=>{ if(b.disabled) return; b.disabled=true; sfx('click'); f(); }; $('pane').appendChild(b); },300); }
function clearPane(){ [...$('pane').children].filter(x=>!/\b(right|wrong)\b/.test(x.className||'')).forEach(x=>{ try{ x.remove(); }catch(e){} }); }
function popTxt(t){ const d=document.createElement('div'); d.className='pop'; d.textContent=t; $('top').appendChild(d); setTimeout(()=>{ try{ d.remove(); }catch(e){} },1200); }
function hud(){ if(!G) return; $('hudL').textContent=`📅 ${when(G.t)}`; $('hudR').textContent=`のこり ${TURNS-G.t}`; if($('side').style.display==='block') renderSide(); }

/* ---------- 音(BGMは本編の魔王魂の曲、効果音は合成) ---------- */
const AU={ctx:null,on:true,el:null,name:null};
try{ AU.on=localStorage.getItem('tk_snd')!=='off'; }catch(e){}
const BGM={title:'../bgm/title.mp3',school:'../bgm/class.mp3',event:'../bgm/battle.mp3',test:'../bgm/boss.mp3',date:'../bgm/ride.mp3'};
/* 曲のファイル(../bgm)が無いとき(GitHub Pages の公開版など)は、合成音の曲で代わりに鳴らす */
const BGM_NG={};
const SYN={title:{bpm:112,n:[72,76,79,84,83,79,76,79,77,81,84,81,79,76,74,72]},school:{bpm:100,n:[67,72,76,72,74,77,76,72,69,72,76,74,72,71,72,0]},
 event:{bpm:140,n:[69,72,76,81,79,76,77,74,69,72,76,81,83,84,83,81]},test:{bpm:160,n:[57,60,64,69,68,64,65,62,57,60,64,69,71,72,71,69]},date:{bpm:120,n:[76,79,84,83,81,79,76,77,79,81,79,77,76,74,72,0]}};
let SYN_T=null, SYN_G=null;
function synthStop(){ clearTimeout(SYN_T); SYN_T=null; if(SYN_G){ try{ SYN_G.disconnect(); }catch(e){} SYN_G=null; } }
function synTone(dest,m,at,d,type,vol){ const c=AU.ctx,o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=440*Math.pow(2,(m-69)/12); g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(0.0008,at+d); o.connect(g); g.connect(dest); o.start(at); o.stop(at+d+0.03); }
function synthPlay(name){ synthStop(); const c=AU.ctx, s=SYN[name]; if(!c||!s) return; const g=c.createGain(); g.gain.value=AU.on?0.5:0; g.connect(c.destination); SYN_G=g; const spb=60/s.bpm/2; let t=c.currentTime+0.05;
 (function loop(){ if(SYN_G!==g) return; if(c.state!=='running'){ SYN_T=setTimeout(loop,500); return; }
   try{ s.n.forEach((m,i)=>{ if(m) synTone(g,m,t+i*spb,spb*0.9,'square',0.035); if(i%4===0) synTone(g,(m||60)-24,t+i*spb,spb*3.6,'triangle',0.07); }); }catch(e){}
   t+=s.n.length*spb; SYN_T=setTimeout(loop,Math.max(50,(t-c.currentTime-0.3)*1000)); })(); }

 if(sv) list.push({t:`▶ つづきから(${HER[sv.her].short}・${when(sv.t)})`,cls:'main',wide:true,f:()=>{ G=loadG(); $('title').style.display='none'; turn(); }});
 list.push({t:'🎞 エンディング一覧',f:openEnds},{t:'🏠 本編へもどる',f:()=>{ location.href='../index.html'; }});

function selectHer(){
 $('title').innerHTML=`<h1 style="font-size:22px">だれと1年を過ごす?</h1><div class="sel">${['saki','yui'].map(k=>`<div><img src="${cutSrc(himg(k,1))}" alt=""><b>${HER[k].name}</b><span>${HER[k].prof}<br>テーマ「${HER[k].theme}」</span></div>`).join('')}</div>`;
 label('ヒロインをえらぶ','あとから変えられない');
 buttons([{t:'💗 サキと過ごす',cls:'pink',f:()=>start('saki')},{t:'💗 ユイと過ごす',cls:'pink',f:()=>start('yui')},{t:'もどる',wide:true,f:title}],2);
}
function start(k){ G=newGame(k); try{ localStorage.removeItem('tk_save2'); }catch(e){} $('title').style.display='none'; saveG(); opening(); }

/* ---------- 入学式 ---------- */
function opening(){
 bg('hall'); bgm('school'); hud(); state='talk'; label('4月 入学式'); album('op');
 const k=G.her;
 talk([['sys','4月。看護専門学校の入学式。'],['eto','オレ、今日から看護学生っす。…まわり、女子ばっかりっすね。','06'],
  ['sys','式のあと、教室で――'],
  ...(k==='saki'?[['saki','あなたが江藤くん?入学式でいびきをかいていたのは。私は委員長の一ノ瀬サキ。',1],['eto','いびきじゃないっす。深呼吸っす。','19'],['saki','…呼吸の中枢がどこにあるかも知らなさそうな顔ね。',4]]
   :[['yui','あの…となり、いいかな。春日ユイです。社会人入学で、勉強は10年ぶりなの。',1],['eto','オレより年上っすね。お姉さんって呼んでいいっすか。','06'],['yui','ふふ、ユイでいいよ。1年間、よろしくね。',2]]),
  ['karui','よっ、江藤っち!オレはカルイ。この学校のことなら何でも聞いて!女子の気持ちも、だいたいわかる!'],['eto','だいたいって何すか。','19'],
  ['sys',`こうして、江藤くんの看護学生生活が始まった。\n1週間は前半・後半の2回。行動をえらんで、知識と${HN()}との関係を育てよう。`]],()=>{ addLove(k,3); turn(); });
}

/* ---------- ターンの流れ ---------- */
function turn(){
 if(G.t>=TURNS) return finalDay(); hud(); saveG(); $('note').style.display='none';
 const fx=FIX[G.t]; if(fx&&!G.fixDone[G.t]){ G.fixDone[G.t]=1; return fx(); }
 if(G.actDone) return endTurn();
 if(G.sick){ G.sick=false; G.actDone=true; home(true); pic(etoCard(4)); say('eto','…熱っぽいっす。ストレスがたまりすぎて、体調くずしたっす。今回は休むっす。','09'); addStress(-40); label('🤒 体調不良'); clearPane(); return nextBtn(endTurn); }
 menu();
}
function menu(){
 state='menu'; bg(mIdx(G.t)>=8&&mIdx(G.t)<=10?'winter':'school'); bgm('school'); pic(etoCard(G.stress>=80?4:1)); home(true); hud();
 const u=unitNow(G.t), uname=u?UNIT_NAME[u]:'これまでのまとめ';
 say('sys',`${when(G.t)}。何をする?`+(G.stress>=80?'\n⚠ ストレスがたまっていて、効果が半分になる…':''));
 label(`今月の授業:${uname}`,`のこり ${TURNS-G.t}`);
 const h=H();
 buttons([
  {t:'📚 授業\nからだ・くすり',f:actClass},{t:'📖 自習\nまちがいの復習',f:actStudy},
  {t:'💉 実技練習\n看護技術',f:actSkill},{t:'🤝 ボランティア\n思いやり',f:actVol},
  {t:'🏃 部活\n体力',f:actJog},{t:'💴 バイト\nお金',f:actJob},
  {t:'🛌 休む\nストレス回復',f:actRest},{t:`💗 ${HN()}に会う`,cls:'pink',f:meet},
  {t:`🌸 デートに誘う(💴3000)`,dis:G.money<3000||h.love<20,f:date},{t:'📱 カルイに聞く',f:askKarui}
 ],2,'menu');
}
function finishAct(){ G.actDone=true; saveG(); clearPane();
 const ev=rollOtherEvent(); if(ev){ return nextBtn(()=>{ album('oe_'+ev.id); G.cool[ev.id]=G.t; if(ev.once) G.once[ev.id]=1; state='talk'; ev.run(()=>{ clearPane(); nextBtn(endTurn); }); }); }
 nextBtn(endTurn);
}
function endTurn(){
 const h=H(); const wasHalf=halfOf(G.t);
 if(wasHalf===1){
  if(G.t-h.last>=3&&h.love>0&&!G.lover) h.love=Math.max(0,h.love-2); // すれちがい
  if(G.stress>=90) G.sick=true;
 }
 G.t++; G.actDone=false; saveG();
 if(wasHalf===1&&wOf(G.t-1)%4===3) return monthSummary(); // 月のまとめ
 if(wasHalf===1) return weekEnd();
 turn();
}
/* 週の終わり:告白チャンスの前はカルイの「脈ありメーター」、ほかはときどき予告 */
function weekEnd(){
 const nextChance=CHANCES.find(c=>c.t>=G.t&&c.t<G.t+2);
 if(nextChance&&!G.lover){ const r=Math.round(confessRate()/10); state='talk';
   return talk([['karui',`江藤っち!もうすぐ「${nextChance.name}」だぜ。${HN()}の脈ありメーター、オレの見立てだと…`],['karui',r>=7?`${r}割!かなり脈ありだ!`:r>=4?`${r}割ってとこかな。もうひと押し!`:`${r}割…。今はまだ友達って感じだな。`]],turn); }
 const nf=Object.keys(FIX).map(Number).find(x=>x>G.t&&x<=G.t+3&&FIX_NAME[x]);
 if(nf&&Math.random()<0.5){ state='talk'; return talk([['karui',`来週あたり「${FIX_NAME[nf]}」があるらしいぜ。準備しとけよ!`]],turn); }
 turn();
}
function monthSummary(){
 state='note'; home(false); pic(null); hud(); const h=H(), m=monthNum(G.t-1);
 say('sys',`${m}月が終わった。${G.t>=TURNS?'':'来月もがんばろう!'}`);
 $('note').innerHTML=`<h2>📅 ${m}月のまとめ</h2><div class="row">${faceIcon(G.her).replace('class="fc"','class="fc"')}<div style="flex:1">${HN()} ${G.lover?'💑恋人':''} 💗${h.love} 🤝${h.trust}<div class="bar"><i style="width:${h.love}%;background:#ff6b9a"></i></div><div class="bar" style="margin-top:3px"><i style="width:${h.trust}%;background:#4dabf7"></i></div></div></div>`+
  `<ul><li>からだの知識 ${G.st.body} ・ 病気とくすり ${G.st.med}</li><li>看護技術 ${G.st.skill} ・ 思いやり ${G.st.care} ・ 体力 ${G.st.hp}</li><li>ストレス ${G.stress} ・ お金 ${G.money}円</li><li>${HN()}の物語 ${h.ch}/5章 ・ まちがいノート ${G.miss.length}問</li><li>思い出アルバム ${Object.keys(ALBUM).length}枚</li></ul>`+
  `<p class="by">${G.t>=TURNS?'いよいよ修了式。':`来月の授業は「${unitNow(G.t)?UNIT_NAME[unitNow(G.t)]:'これまでのまとめ'}」。`}${!G.lover?`告白されるには、💗と🤝の両方と「${HER[G.her].needName}」が大事。`:'恋人になっても、進級試験に受かってこそ最高のエンド!'}</p>`;
 $('note').style.display='block'; label(`${m}月のまとめ`,'ここでやめても、つづきから遊べる');
 buttons([{t:'つぎの月へ ▶',cls:'main',f:()=>{ $('note').style.display='none'; turn(); }}]);
}
function askKarui(){ state='talk'; G.friend++; const h=H(), r=Math.round(confessRate()/10);
 const tips=[`${HN()}は「${HER[G.her].needName}」がある人に弱いらしいぜ。`,`3回くらい会わないと、気持ちが冷めちゃうかもな。`,`デートは💗がぐっと上がるけど、お金がいるぞ。`,`ストレスは80をこえると何やっても半分の効果だ。90で体調くずすぞ。`,`まちがえた問題は「自習」で復習できる。試験に出るぜ!`];
 talk([['karui',G.lover?`もう恋人なんだろ?うらやましいぜ!あとは進級試験だな。`:`${HN()}の今の脈ありメーターは…${r}割ってとこだな。`],['karui',pick(tips)]],()=>menu());
}
/* 行動 */

 quiz(3,`📚 授業:${u?UNIT_NAME[u]:'まとめ'}`,(ok,got)=>{ let b=0,m=0; got.forEach(q=>{ if(UNIT_ST[q.u]==='med') m+=3; else b+=3; }); if(b) addSt('body',b); if(m) addSt('med',m);
   home(true); pic(etoCard(ok>=2?2:4)); say('sys',`授業おわり。3問中 ${ok}問 正解。`+(b?`\nからだの知識 +${b}`:'')+(m?`\n病気とくすり +${m}`:'')); label('📚 授業'); finishAct(); },null,units); }
function actStudy(){ state='act'; addStress(4); const units=learnedUnits(G.t);
 quiz(3,`📖 自習(まちがいノート ${G.miss.length}問)`,(ok,got)=>{ let b=0,m=0; got.forEach(q=>{ if(UNIT_ST[q.u]==='med') m+=2; else b+=2; }); if(b) addSt('body',b); if(m) addSt('med',m);
   home(true); pic(etoCard(1)); say('sys',`自習おわり。${ok}問 正解。まちがいノートは のこり ${G.miss.length}問。`); label('📖 自習'); finishAct(); },null,units,true); }

   n++; gaugeOnce(`💉 実技練習 ${n}/3`,s=>{ pts+=s; say('sys',['ハズレ…','ちょいズレ','ナイス!','完ぺき!'][s]+`(${n}/3)`); nextBtn(one); }); })(); }
const VOL=[
 {q:'病院のボランティア。入院中のおばあさんが「家に帰りたい…」とつぶやいた。',opts:[['帰れないっすよ。入院中なんで。',-1,'事実だけど、気持ちを受けとめていない…'],['そうですよね、お家が恋しいですよね。',2,'まず気持ちを受けとめる。それだけで安心することがある'],['元気出してください!',1,'はげましも大事。でも、まず気持ちを聞いてから']]},
 {q:'車いすの男性が、自動販売機の前で困っている。',opts:[['だまって押していく。',-1,'急に押すと驚かせる。まず声をかける'],['何かお手伝いしましょうか?',2,'まず声をかけて、相手の希望を聞く'],['大変っすね。がんばってください。',0,'気づいたなら、声をかけて手伝おう']]},

 {q:'外国から来た患者さんが、言葉が通じず不安そう。',opts:[['日本語で話してください',-2,'相手を責めても伝わらない'],['身ぶりや絵、翻訳アプリを使って、笑顔でゆっくり伝える',2,'伝える工夫と、安心させる表情が大事'],['ほかの人を呼んでくるっす',0,'助けを呼ぶのも大事。そのあいだ、そばで安心させよう']]}
];
function actVol(){ state='act'; bg('hosp'); const v=pick(VOL); VOLNOW=v; addStress(3);

 buttons(shuffle(v.opts).map(o=>({t:o[0],f:b=>{ VOLNOW=null; disableAll(); const g=addSt('care',o[1]>=2?8:o[1]===1?4:o[1]===0?2:1); b.classList.add(o[1]>=2?'right':o[1]<0?'wrong':''); say('sys',(o[1]>=2?'⭕ ':o[1]<0?'△ ':'○ ')+o[2]+`\n思いやり +${g}`); finishAct(); }})),1); }
function actJog(){ state='act'; bg('park'); const v=addSt('hp',6); addStress(-6); home(true); pic(etoCard(2)); say('eto',`部活で走ってきたっす。気持ちいいっす。\n体力 +${v}、ストレス -6`,'02'); label('🏃 部活'); finishAct(); }
function actJob(){ state='act'; bg('hall'); G.money+=4000; addStress(8); popTxt('💴 +4000'); home(true); pic(etoCard(1)); say('eto','コンビニのバイト、おわったっす。4000円ゲットっす。','15'); label('💴 バイト'); finishAct(); }
function actRest(){ state='act'; bg('pink'); addStress(-30); home(true); pic(etoCard(2)); say('eto','今回はゆっくり休んだっす。ストレス -30','02'); label('🛌 休む'); finishAct(); }

/* ---------- 告白される確率 ---------- */
function confessRate(){ const h=H(), need=G.st[HER[G.her].need];
 const r=(h.love-40)*1.2+(h.trust-30)*0.8+Math.min(15,Math.max(0,(need-15)/2))+h.ch*5-(G.stress>=80?10:0);
 return Math.round(clamp(r,0,95)); }
const CHANCES=[{t:tOf(18,1),name:'夏祭り',bg:'summer'},{t:tOf(27,1),name:'学園祭の後夜祭',bg:'night'},{t:tOf(35,1),name:'クリスマス',bg:'winter'},{t:tOf(41,0),name:'バレンタイン',bg:'pink'},{t:tOf(47,1),name:'修了式のあと',bg:'night'}];
function chance(c,done){ state='talk'; home(false); pic(null); bg(c.bg); bgm('date'); const k=G.her, h=H(); h.last=G.t; album('ch_'+c.name);
 const scene={'夏祭り':[['sys','夏祭りの夜。浴衣の人たちでにぎわっている。'],[k,k==='saki'?'…別に、あなたと来たかったわけじゃないから。たまたまよ。':'江藤くん、りんごあめ半分こしよ?',k==='saki'?3:2]],
  '学園祭の後夜祭':[['sys','学園祭の後夜祭。校庭のまん中でキャンプファイヤーが燃えている。'],[k,k==='saki'?'…今日の模擬店、あなたがいて助かったわ。':'火、きれいだね。…ねえ、少し歩かない?',1]],
  'クリスマス':[['sys','クリスマスの夜。駅前のイルミネーションがまぶしい。'],[k,k==='saki'?'寒いわね。…手、冷たくない?':'わあ、きれい…。江藤くんと見られてよかった。',3]],
  'バレンタイン':[['sys','2月14日。放課後の昇降口。'],[k,k==='saki'?'…これ。べ、勉強を教えてもらったお礼よ。それだけ。':'これ、手作りなの。…受けとってくれる?',3]],
  '修了式のあと':[['sys','修了式のあと。夕焼けの屋上。1年間が終わろうとしている。'],[k,k==='saki'?'…1年、あっという間だったわね。':'1年、ありがとう。江藤くんがいてくれて、よかった。',1]]}[c.name];
 if(G.lover){ return talk(scene.concat([[k,k==='saki'?'…こうして一緒にいられるの、悪くないわね。':'恋人になってから、毎日がもっと楽しいよ。',2]]),()=>{ addLove(k,5); addStress(-10); done(); }); }
 const rate=confessRate(), win=Math.random()*100<rate;
 talk(scene,()=>{
  if(!win){ return talk([[k,k==='saki'?'…今日は、楽しかった。また、勉強も見てあげる。':'今日はありがとう。…これからも、仲良くしてね。',1],['sys',`(${HN()}は何か言いかけて、やめたようだ。)\n告白されなかった…。でも、まだチャンスはある。`]],()=>{ addLove(k,3); done(); }); }
  sfx('bell');
  talk([[k,k==='saki'?'…江藤くん。私、ずっと言えなかったことがあるの。':'江藤くん…あのね、聞いてほしいことがあるの。',4],
   [k,k==='saki'?'あなたのこと…好き。完ぺきじゃない私でも、いいなら…つきあって、ください。':'私…あなたのことが好き。年上だけど…私と、つきあってくれますか?',3]],()=>{
   say('sys',`${HN()}に告白された!`); label('💗 告白された!');
   buttons([{t:'💗 オレもっす!よろしくお願いします!',cls:'pink',f:()=>{ G.lover=true; album('lover'); addLove(k,10,10); talk([['eto','オレも…ずっと好きだったっす!','c3'],[k,k==='saki'?'…ばか。顔、真っ赤よ。…私もだけど。':'うれしい…!これからも、よろしくね。',2],['sys','2人は恋人になった。\nでも、看護学生の1年はまだ続く。進級試験に受かってこそ、最高のエンディング!']],done); }},
    {t:'…ごめん。今は看護の勉強に集中したいっす',f:()=>{ G.declined=true; talk([['eto','…ごめん。今は、看護師になることだけ考えたいっす。','c4'],[k,'…そっか。うん、江藤くんらしいね。応援してる。',4]],done); }}],1); }); });
}

  quiz(n,`📝 ${title}`,ok=>{ const pass=ok>=Math.ceil(n*0.6); G[key]=ok; if(pass) addSt('body',ok); else addStress(20);
